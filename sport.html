<!doctype html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040b17" id="metaTheme">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("enstp-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<title>ENSTP Arena — Sport</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== ENSTP — نظام التصميم الموحد ===== */
:root{
--bg:#f3f6fc;--ink:#1b2a47;--muted:#5a6b88;--head:#0b1d3a;
--gold:#f5b841;--gold-2:#ffdf9a;--cyan:#38bdf8;--violet:#8b7bff;
--glass-b:rgba(20,50,110,.13);--radius:26px;--ease:cubic-bezier(.22,1,.36,1);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#d6e6ff 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#e6eeff 0%,transparent 60%),#f3f6fc;
--au-op:.55;--grid:rgba(40,80,160,.08);
--bar:rgba(255,255,255,.72);--bar-s:rgba(255,255,255,.92);
--bar-shadow:0 14px 40px rgba(20,50,110,.14);--bar-inset:rgba(255,255,255,.9);
--logo-grad:linear-gradient(100deg,#0b1d3a,#b9770e);
--soft:rgba(20,50,110,.05);--soft-b:rgba(20,50,110,.1);--nav-c:#41547a;
--hero-o1:rgba(8,26,60,.5);--hero-o2:rgba(8,26,60,.82);
--card:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,255,255,.72));
--card-b:rgba(20,50,110,.11);--card-shadow:0 20px 50px rgba(20,50,110,.13);
--card-shadow-h:0 34px 70px rgba(20,50,110,.2),0 0 50px rgba(245,184,65,.18);
--desc:#53648a;--tag-c:#a8650a;--icon-ring:#fff;--img-fade:rgba(8,22,50,.55);
--btn-c:#1e3358;--toggle-bg:#0b1d3a;--toggle-c:#ffdf9a;
}
html[data-theme="dark"]{
--bg:#040b17;--ink:#e8eef9;--muted:#8fa3c0;--head:#fff;--glass-b:rgba(255,255,255,.12);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#0d2a52 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#0a1d3d 0%,transparent 60%),#040b17;
--au-op:1;--grid:rgba(120,160,220,.07);
--bar:rgba(8,18,36,.55);--bar-s:rgba(5,12,26,.85);--bar-shadow:0 18px 50px rgba(0,0,0,.35);--bar-inset:rgba(255,255,255,.08);
--logo-grad:linear-gradient(100deg,#fff,#ffdf9a);
--soft:rgba(255,255,255,.05);--soft-b:rgba(255,255,255,.1);--nav-c:#b9c8df;
--hero-o1:rgba(4,11,23,.55);--hero-o2:rgba(4,11,23,.92);
--card:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
--card-b:rgba(255,255,255,.1);--card-shadow:0 22px 60px rgba(0,0,0,.35);
--card-shadow-h:0 36px 80px rgba(0,0,0,.5),0 0 60px rgba(245,184,65,.12);
--desc:#9db0cd;--tag-c:#ffdf9a;--icon-ring:#0a1730;--img-fade:rgba(4,11,23,.92);
--btn-c:#dbe7fb;--toggle-bg:#ffdf9a;--toggle-c:#14100a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body[data-lang="fr"],body[data-lang="en"]{font-family:'Inter','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#101828}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* خلفية حية */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--au-bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#1d5fd1;top:-120px;inset-inline-start:-80px;opacity:calc(.38*var(--au-op))}
.aurora i:nth-child(2){width:460px;height:460px;background:#7c4dff;top:45%;inset-inline-end:-120px;animation-duration:28s;opacity:calc(.28*var(--au-op))}
.aurora i:nth-child(3){width:420px;height:420px;background:#f5b841;bottom:-160px;inset-inline-start:30%;animation-duration:32s;opacity:calc(.16*var(--au-op))}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:200}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--violet));box-shadow:0 0 18px var(--gold)}

/* الشريط العلوي */
header{position:fixed;top:14px;inset-inline:0;z-index:150;padding:0 14px}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 14px;border-radius:22px;background:var(--bar);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--bar-shadow),inset 0 1px 0 var(--bar-inset)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{background:#fff;border-radius:14px;padding:5px 9px;box-shadow:0 6px 20px rgba(0,0,0,.3);flex-shrink:0}
.logo-img img{height:38px;width:auto;object-fit:contain}
#txt-brand{font-weight:900;font-size:1.05rem;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;font-size:.78rem;font-weight:800;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);white-space:nowrap;transition:.3s}
.back:hover{color:#111;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px rgba(245,184,65,.35)}
[dir="rtl"] .back i{transform:scaleX(-1)}
.lang{display:flex;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--soft-b)}
.lang button{font:inherit;font-size:.74rem;font-weight:800;padding:7px 11px;border-radius:10px;border:0;cursor:pointer;color:var(--nav-c);background:transparent;transition:.3s}
.lang button.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111;box-shadow:0 4px 14px rgba(245,184,65,.4)}
.theme-btn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--soft-b);cursor:pointer;overflow:hidden;background:var(--toggle-bg);color:var(--toggle-c);display:grid;place-items:center;flex-shrink:0;transition:transform .35s var(--ease)}
.theme-btn:hover{transform:translateY(-2px) rotate(-8deg)}
.theme-btn i{position:absolute;transition:transform .6s var(--ease),opacity .4s}
.theme-btn .i-sun{transform:translateY(130%) rotate(-90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-moon{transform:translateY(-130%) rotate(90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-sun{transform:none;opacity:1}

/* الواجهة */
.hero{position:relative;min-height:62svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate;padding:150px 20px 90px}
.hero-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,var(--hero-o1),var(--hero-o2)),url('photo11.jpg') center/cover no-repeat,linear-gradient(135deg,#0b2545,#1d5288)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 72%,var(--bg) 100%)}
.hero-inner{max-width:900px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:800;color:var(--gold-2);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(245,184,65,.4);backdrop-filter:blur(14px);margin-bottom:24px}
.hero h1{font-weight:900;font-size:clamp(1.9rem,5vw,3.6rem);line-height:1.35;color:#fff;text-wrap:balance;margin-bottom:22px;text-shadow:0 10px 50px rgba(0,0,0,.6)}
.hero h1 span{display:block;background:linear-gradient(100deg,#fff 0%,var(--gold-2) 40%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9d6ea;font-size:clamp(.95rem,1.5vw,1.08rem);line-height:2.05;max-width:760px;margin:0 auto}

main{max-width:1280px;margin:0 auto;padding:40px 20px 40px;display:flex;flex-direction:column;gap:90px}
.sec-head{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.sec-icon{flex-shrink:0;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:1.5rem;color:#fff;position:relative;background:linear-gradient(145deg,var(--c1,#2563eb),var(--c2,#38bdf8));box-shadow:0 14px 40px var(--c3,rgba(37,99,235,.45)),inset 0 1px 0 rgba(255,255,255,.4)}
.sec-icon::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:1px solid var(--c1,#2563eb);opacity:.35}
.sec-head h2{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:900;line-height:1.4;color:var(--head)}
.sec-head p{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:640px}
.sec-line{height:3px;width:90px;margin-top:12px;border-radius:3px;background:linear-gradient(270deg,var(--gold),transparent)}
[dir="ltr"] .sec-line{background:linear-gradient(90deg,var(--gold),transparent)}
.s-a{--c1:#2563eb;--c2:#38bdf8;--c3:rgba(37,99,235,.5)}
.s-b{--c1:#6d5cff;--c2:#b093ff;--c3:rgba(109,92,255,.5)}
.s-c{--c1:#059669;--c2:#34d399;--c3:rgba(5,150,105,.5)}
.s-d{--c1:#d97706;--c2:#fbbf24;--c3:rgba(217,119,6,.5)}

/* البطاقات */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
@media(max-width:992px){.two{grid-template-columns:1fr}}
.box{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);padding:32px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow)}
.box h3.t{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:900;color:var(--head);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--card-b)}
.box h3.t i{color:var(--gold)}
.box p{color:var(--desc);font-size:.92rem;line-height:2;margin-bottom:14px}
.director{display:flex;gap:22px;align-items:center;background:var(--soft);border:1px solid var(--card-b);padding:22px;border-radius:20px;margin-top:10px}
.director img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 25px rgba(245,184,65,.4);flex-shrink:0}
.director h4{font-size:1.1rem;font-weight:900;color:var(--head);margin-bottom:4px}
.director small{display:block;font-size:.78rem;color:var(--tag-c);font-weight:800;margin-bottom:6px}
.director p{font-size:.82rem;line-height:1.8;margin:0}
@media(max-width:600px){.director{flex-direction:column;text-align:center}}

.search-card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.search-card:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.card-image-wrap{position:relative;height:220px;overflow:hidden;background:linear-gradient(135deg,#0b2545,#1d5288)}
.card-image{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s;filter:saturate(1.05) brightness(.95)}
.search-card:hover .card-image{transform:scale(1.1);filter:saturate(1.25) brightness(1.05)}
.card-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--img-fade) 100%)}
.card-content{padding:18px 20px 20px}
.card-title{font-size:.98rem;font-weight:800;line-height:1.7;color:var(--head);text-align:center}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:auto;padding:15px 18px;border-radius:16px;font-weight:900;font-size:.9rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 14px 36px rgba(245,184,65,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s var(--ease),box-shadow .35s}
.btn:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(245,184,65,.55)}

footer{position:relative;margin-top:50px;padding:70px 20px 46px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#12386a 0%,transparent 65%),#030812}
footer::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 30px var(--gold)}
.f-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:1.6rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 14px 40px rgba(245,184,65,.4)}
#footer-title{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:6px}
#footer-sub{font-size:.85rem;color:#8fa3c0;max-width:520px;margin:0 auto}
.to-top{position:fixed;bottom:22px;inset-inline-end:18px;z-index:140;width:48px;height:48px;border-radius:16px;border:1px solid var(--glass-b);cursor:pointer;color:var(--tag-c);background:var(--bar-s);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(20px);transition:.4s var(--ease)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top:hover{background:var(--gold);color:#111}

.reveal{opacity:0;translate:0 40px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.reveal.in{opacity:1;translate:0 0}

@media(max-width:640px){
header{top:8px;padding:0 8px}
.bar{padding:7px 9px;border-radius:18px;gap:8px}
.logo-img img{height:30px}
#txt-brand{display:none}
.back span{display:none}
.lang button{padding:6px 8px;font-size:.68rem}
.hero{padding:120px 18px 70px}
main{gap:70px}
.card-image-wrap{height:190px}
.box{padding:24px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;translate:0 0}}


/* ===== ENSTP Arena ===== */
.hidden{display:none!important}
:root{--foot:#10b981;--basket:#f97316;--pend:#f59e0b;--bad:#ef4444;--good:#10b981}
.hero{min-height:auto;text-align:start;padding:130px 20px 70px}
.hero-bg{background:radial-gradient(900px 500px at 80% 10%,rgba(56,189,248,.28),transparent 60%),radial-gradient(700px 500px at 10% 90%,rgba(16,185,129,.22),transparent 60%),linear-gradient(135deg,#071a33,#0b2a52 55%,#10335f)}
.hero-bg::after{background:linear-gradient(180deg,transparent 70%,var(--bg) 100%)}
.hero-grid{max-width:1280px;width:100%;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.2rem,5.6vw,4.4rem);margin-bottom:20px}
.hero h1 .g{display:inline;background:linear-gradient(100deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:560px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.cta .btn{width:auto;margin:0;padding-inline:28px}
.btn-ghost{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:16px;font-weight:900;font-size:.9rem;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);transition:.3s var(--ease);cursor:pointer;font-family:inherit}
.btn-ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.16)}
.live{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.live .lv{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#e5eefb;font-size:.8rem;font-weight:800;backdrop-filter:blur(10px)}
.live .lv i{font-size:1.1rem}
.live .lv b{font-family:'Inter',sans-serif;font-size:1.2rem;color:var(--gold-2)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(16,185,129,.7);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 12px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.vwrap{position:relative}
.vwrap::before{content:"";position:absolute;inset:-18px;border-radius:40px;background:conic-gradient(from 0deg,var(--cyan),var(--gold),var(--violet),var(--foot),var(--cyan));filter:blur(34px);opacity:.45;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vthumb{position:relative;border-radius:26px;overflow:hidden;border:2px solid rgba(245,184,65,.5);box-shadow:0 30px 80px rgba(0,0,0,.55);width:100%;aspect-ratio:16/10;background:#000}
.vthumb iframe{width:100%;height:100%;border:0;display:block}
.vcap{position:relative;display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.8rem;font-weight:800;color:#c9d6ea}
.vcap i{color:var(--gold)}
.ball{position:absolute;font-size:2rem;opacity:.16;color:#fff;animation:fl 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes fl{to{transform:translateY(-30px) rotate(40deg)}}

.sec-top h2{letter-spacing:-.2px}
.step-tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:'Inter',sans-serif;font-weight:900;font-size:.85rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));margin-inline-end:10px}

/* الملاعب */
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px}
.court{position:relative;border-radius:30px;overflow:hidden;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow);transition:transform .45s var(--ease),box-shadow .45s}
.court:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.court .art{position:relative;aspect-ratio:16/9;overflow:hidden}
.court.foot .art{background:linear-gradient(135deg,#065f46,#10b981)}
.court.basket .art{background:linear-gradient(135deg,#9a3412,#f97316)}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.court svg .ln{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.4;stroke-dasharray:1400;stroke-dashoffset:1400;transition:stroke-dashoffset 2.4s var(--ease)}
.court.in svg .ln,.court:hover svg .ln{stroke-dashoffset:0}
.court .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.court .cico{position:absolute;z-index:2;top:16px;inset-inline-start:16px;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.4rem;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3)}
.court .free{position:absolute;z-index:2;top:16px;inset-inline-end:16px;font-size:.74rem;font-weight:900;padding:7px 14px;border-radius:999px;color:#fff;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);display:flex;gap:8px;align-items:center}
.court .cb{padding:24px 26px 26px}
.court h3{font-size:1.35rem;font-weight:900;color:var(--head);margin-bottom:6px}
.court .cb p{color:var(--desc);font-size:.9rem;line-height:1.9;margin-bottom:16px}
.court .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.court .meta span{font-size:.74rem;font-weight:800;padding:7px 13px;border-radius:999px;background:var(--soft);border:1px solid var(--card-b);color:var(--ink);display:inline-flex;gap:7px;align-items:center}
.court .meta i{color:var(--gold)}
.court.foot .btn{background:linear-gradient(135deg,#6ee7b7,#10b981);color:#04281c;box-shadow:0 14px 36px rgba(16,185,129,.4)}
.court.basket .btn{background:linear-gradient(135deg,#fdba74,#f97316);color:#2b1204;box-shadow:0 14px 36px rgba(249,115,22,.4)}

let LANG='ar';
const t=k=>(T[LANG][k]!==undefined?T[LANG][k]:k);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COURT={foot:{i:'fa-futbol',k:'footTitle',col:'#10b981'},basket:{i:'fa-basketball',k:'baskTitle',col:'#f97316'}};
const KIND={news:{i:'fa-bullhorn',k:'kNews'},course:{i:'fa-graduation-cap',k:'kCourse'},tournament:{i:'fa-trophy',k:'kTournament'},rule:{i:'fa-scroll',k:'kRule'}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const locale=()=>({ar:'ar-u-nu-latn',fr:'fr-FR',en:'en-GB'}[LANG]);
function fmtDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(locale(),{weekday:'long',day:'numeric',month:'long'})}
const HOURS=[];for(let h=DAY_START;h<DAY_END;h++)if(!BREAK_HOURS.includes(h))HOURS.push(h);
const slotLabel=h=>'\u2066'+pad(h)+':00 – '+pad(h+1)+':00\u2069';
const slotId=(c,d,h)=>c+'_'+d+'_'+pad(h);
let toastT;function toast(msg,bad){const e=$('#toast');e.textContent=msg;e.className='toast show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>e.className='toast',3600)}

/* ───────── طبقة البيانات: Firebase أو الوضع التجريبي ───────── */
const DEMO=!FIREBASE_CONFIG;
let DB;
function ready(fn){if(DEMO||window.firebase)return fn();const iv=setInterval(()=>{if(window.firebase&&firebase.firestore&&firebase.auth){clearInterval(iv);fn()}},60)}

function makeDemo(){
  const K='enstp-sport-demo-v1',AK='enstp-sport-demo-admin';
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{slots:{},bookings:{},posts:[]}}catch(e){return{slots:{},bookings:{},posts:[]}}};
  let mem=load();
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}};
  const subs=new Set();const fire=()=>subs.forEach(f=>f());
  addEventListener('storage',e=>{if(e.key===K){mem=load();fire()}});
  const sub=(fn)=>{subs.add(fn);fn();return()=>subs.delete(fn)};
  let adminOn=false;try{adminOn=sessionStorage.getItem(AK)==='1'}catch(e){}
  const authSubs=new Set();
  return{
    subscribeSlots:(c,d,cb)=>sub(()=>cb(Object.values(mem.slots).filter(s=>s.court===c&&s.date===d))),
    subscribeAllSlotsOn:(d,cb)=>sub(()=>cb(Object.values(mem.slots).filter(s=>s.date===d))),
    async createBooking(b){const id=slotId(b.court,b.date,b.hour);if(mem.slots[id])throw{code:'taken'};
      const bid='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      mem.slots[id]={court:b.court,date:b.date,hour:b.hour,status:'pending',bid};
      mem.bookings[bid]=Object.assign({},b,{status:'pending',reply:'',createdAt:Date.now()});save();fire();return bid},
    watchBooking:(id,cb)=>sub(()=>cb(mem.bookings[id]||null)),
    subscribeBookings:(cb)=>sub(()=>cb(Object.entries(mem.bookings).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>b.createdAt-a.createdAt))),
    async setStatus(id,status,reply){const b=mem.bookings[id];if(!b)return;const sid=slotId(b.court,b.date,b.hour);b.status=status;b.reply=reply||'';
      if(status==='accepted'&&mem.slots[sid])mem.slots[sid].status='approved';if(status==='refused')delete mem.slots[sid];save();fire()},
    async blockSlot(c,d,h){const id=slotId(c,d,h);if(mem.slots[id])throw{code:'taken'};mem.slots[id]={court:c,date:d,hour:h,status:'blocked'};save();fire()},
    async unblock(id){delete mem.slots[id];save();fire()},
    subscribeBlocked:(cb)=>sub(()=>cb(Object.entries(mem.slots).filter(([k,v])=>v.status==='blocked').map(([id,v])=>Object.assign({id},v)))),
    subscribePosts:(cb)=>sub(()=>cb(mem.posts.slice().sort((a,b)=>b.createdAt-a.createdAt))),
    async addPost(p){mem.posts.push(Object.assign({id:'p'+Date.now(),createdAt:Date.now()},p));save();fire()},
    async delPost(id){mem.posts=mem.posts.filter(p=>p.id!==id);save();fire()},
    async login(e,p){if(p!==DEMO_PASSWORD)throw{code:'auth'};adminOn=true;try{sessionStorage.setItem(AK,'1')}catch(x){}authSubs.forEach(f=>f(true))},
    async logout(){adminOn=false;try{sessionStorage.removeItem(AK)}catch(x){}authSubs.forEach(f=>f(false))},
    onAuth:(cb)=>{authSubs.add(cb);cb(adminOn)}
  };
}
function makeFirebase(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue;
  const ms=v=>v&&v.toMillis?v.toMillis():(v||0);
  const errH=e=>console.warn('Firestore:',e&&e.code);
  return{
    subscribeSlots:(c,d,cb)=>db.collection('sport_slots').where('court','==',c).where('date','==',d).onSnapshot(s=>cb(s.docs.map(x=>x.data())),errH),
    subscribeAllSlotsOn:(d,cb)=>db.collection('sport_slots').where('date','==',d).onSnapshot(s=>cb(s.docs.map(x=>x.data())),errH),
    async createBooking(b){const ref=db.collection('sport_bookings').doc();const sref=db.collection('sport_slots').doc(slotId(b.court,b.date,b.hour));
      const batch=db.batch();batch.set(sref,{court:b.court,date:b.date,hour:b.hour,status:'pending',bid:ref.id});
      batch.set(ref,Object.assign({},b,{status:'pending',reply:'',createdAt:FV.serverTimestamp()}));
      try{await batch.commit()}catch(e){throw{code:(e.code==='permission-denied')?'taken':'err'}}return ref.id},
    watchBooking:(id,cb)=>db.collection('sport_bookings').doc(id).onSnapshot(s=>cb(s.exists?s.data():null),errH),
    subscribeBookings:(cb)=>db.collection('sport_bookings').orderBy('createdAt','desc').onSnapshot(s=>cb(s.docs.map(x=>Object.assign({id:x.id},x.data(),{createdAt:ms(x.data().createdAt)}))),errH),
    async setStatus(id,status,reply){const bref=db.collection('sport_bookings').doc(id);const snap=await bref.get();const b=snap.data();const sref=db.collection('sport_slots').doc(slotId(b.court,b.date,b.hour));
      const batch=db.batch();batch.update(bref,{status,reply:reply||''});
      if(status==='accepted')batch.set(sref,{court:b.court,date:b.date,hour:b.hour,status:'approved',bid:id});else if(status==='refused')batch.delete(sref);
      await batch.commit()},
    async blockSlot(c,d,h){const ref=db.collection('sport_slots').doc(slotId(c,d,h));const s=await ref.get();if(s.exists)throw{code:'taken'};await ref.set({court:c,date:d,hour:h,status:'blocked'})},
    async unblock(id){await db.collection('sport_slots').doc(id).delete()},
    subscribeBlocked:(cb)=>db.collection('sport_slots').where('status','==','blocked').onSnapshot(s=>cb(s.docs.map(x=>Object.assign({id:x.id},x.data()))),errH),
    subscribePosts:(cb)=>db.collection('sport_posts').orderBy('createdAt','desc').onSnapshot(s=>cb(s.docs.map(x=>Object.assign({id:x.id},x.data(),{createdAt:ms(x.data().createdAt)}))),errH),
    async addPost(p){await db.collection('sport_posts').add(Object.assign({},p,{createdAt:FV.serverTimestamp()}))},
    async delPost(id){await db.collection('sport_posts').doc(id).delete()},
    async login(e,p){try{const r=await auth.signInWithEmailAndPassword(e,p);if(MANAGER_EMAIL&&r.user.email.toLowerCase()!==MANAGER_EMAIL.toLowerCase()){await auth.signOut();throw{code:'notmgr'}}}catch(x){throw x.code==='notmgr'?x:{code:'auth'}}},
    async logout(){await auth.signOut()},
    onAuth:(cb)=>auth.onAuthStateChanged(u=>cb(!!u&&(!MANAGER_EMAIL||u.email.toLowerCase()===MANAGER_EMAIL.toLowerCase())))
  };
}

/* ───────── الواجهة ───────── */
const S={court:'foot',date:null,hour:null,slots:[],filter:'all',reqFilter:'pending',posts:[],reqs:[]};
let unSlots=null;

function buildDays(){
  const box=$('#days');box.innerHTML='';const now=new Date();let first=null;
  for(let i=0;i<DAYS_AHEAD;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);if(CLOSED_WEEKDAYS.includes(d.getDay()))continue;
    const s=dstr(d);if(!first)first=s;
    const b=document.createElement('button');b.type='button';b.className='day';b.dataset.d=s;
    b.innerHTML='<small>'+esc(t('days')[d.getDay()])+'</small><b>'+d.getDate()+'</b><em>'+(i===0?esc(t('today')):i===1?esc(t('tomorrow')):d.toLocaleDateString(locale(),{month:'short'}))+'</em>';
    b.onclick=()=>{S.date=s;S.hour=null;paintDays();watchSlots()};box.appendChild(b)}
  if(!S.date||!$('.day[data-d="'+S.date+'"]'))S.date=first;paintDays();
}
function paintDays(){$$('.day').forEach(b=>b.classList.toggle('on',b.dataset.d===S.date))}
function slotState(h){
  const f=S.slots.find(s=>s.hour===h);const now=new Date();
  if(S.date===dstr(now)&&h<=now.getHours())return{c:'past',l:t('past')};
  if(f){if(f.status==='pending')return{c:'pend',l:t('pend')};if(f.status==='blocked')return{c:'taken',l:t('closed')};return{c:'taken',l:t('taken')}}
  return{c:'free',l:t('free')};
}
function paintSlots(){
  const box=$('#slots');box.innerHTML='';
  HOURS.forEach(h=>{const st=slotState(h);const b=document.createElement('button');b.type='button';
    b.className='slot '+st.c+(S.hour===h?' on':'');b.innerHTML=slotLabel(h).replace(' – ','\u2069<br>\u2066')+'<small>'+esc(st.l)+'</small>';
    b.style.lineHeight='1.35';b.disabled=st.c!=='free';
    b.onclick=()=>{S.hour=h;paintSlots();paintSummary()};box.appendChild(b)});
  if(S.hour!=null&&slotState(S.hour).c!=='free'){S.hour=null}
  paintSummary();
}
function paintSummary(){
  const el=$('#summary');
  if(S.hour==null||!S.date){el.innerHTML='<span><i class="fa-regular fa-hand-pointer"></i>'+esc(t('sumNone'))+'</span>';return}
  el.innerHTML='<span><i class="fa-solid '+COURT[S.court].i+'" style="color:'+COURT[S.court].col+'"></i>'+esc(t(COURT[S.court].k))+'</span><span><i class="fa-regular fa-calendar"></i>'+esc(fmtDate(S.date))+'</span><span><i class="fa-regular fa-clock"></i><span dir="ltr">'+slotLabel(S.hour)+'</span></span>';
}
function watchSlots(){
  if(unSlots){unSlots();unSlots=null}
  if(!S.date)return;
  unSlots=DB.subscribeSlots(S.court,S.date,list=>{S.slots=list;paintSlots()});
}
function pickCourt(c){S.court=c;S.hour=null;$$('.opt').forEach(o=>o.classList.toggle('on',o.dataset.c===c));watchSlots()}

/* العدّادات الحية لليوم */
function liveCounts(){
  const today=dstr(new Date());const open=HOURS.filter(h=>h>new Date().getHours());
  if(CLOSED_WEEKDAYS.includes(new Date().getDay())){['liveFoot','liveBask','cFoot','cBask'].forEach(i=>$('#'+i).textContent='0');return}
  DB.subscribeAllSlotsOn(today,list=>{
    const n=c=>open.filter(h=>!list.some(s=>s.court===c&&s.hour===h)).length;
    $('#liveFoot').textContent=$('#cFoot').textContent=n('foot');$('#liveBask').textContent=$('#cBask').textContent=n('basket');
  });
}

/* طلباتي */
const MYK='enstp-sport-my';
const myIds=()=>{try{return JSON.parse(localStorage.getItem(MYK))||[]}catch(e){return[]}};
const myData={};const myUn={};
function addMy(id){const a=myIds();if(!a.includes(id)){a.unshift(id);try{localStorage.setItem(MYK,JSON.stringify(a.slice(0,30)))}catch(e){}}watchMy(id)}
function watchMy(id){if(myUn[id])return;myUn[id]=DB.watchBooking(id,b=>{if(b)myData[id]=b;else delete myData[id];paintMine()})}
function paintMine(){
  const ids=myIds().filter(i=>myData[i]);$('#mine').classList.toggle('hidden',!ids.length);
  $('#mylist').innerHTML=ids.map(i=>{const b=myData[i];const st=b.status||'pending';const ic=st==='accepted'?'fa-circle-check':st==='refused'?'fa-circle-xmark':'fa-hourglass-half';
    const lab=st==='accepted'?t('stAccepted'):st==='refused'?t('stRefused'):t('stPending');
    return '<div class="req '+st+'"><h4><i class="fa-solid '+COURT[b.court].i+'" style="color:'+COURT[b.court].col+'"></i>'+esc(t(COURT[b.court].k))+'</h4><div class="ln2"><i class="fa-regular fa-calendar"></i>'+esc(fmtDate(b.date))+'</div><div class="ln2"><i class="fa-regular fa-clock"></i><span dir="ltr">'+slotLabel(b.hour)+'</span></div><span class="st2 '+st+'"><i class="fa-solid '+ic+'"></i>'+esc(lab)+'</span>'+(b.reply?'<div class="reply"><b>'+esc(t('replyLbl'))+'</b> '+esc(b.reply)+'</div>':'')+'</div>'}).join('');
}

/* إرسال الطلب */
async function submitBooking(e){
  e.preventDefault();
  if(S.hour==null){toast(t('tPickSlot'),1);return}
  const name=$('#fName').value.trim(),contact=$('#fContact').value.trim(),players=parseInt($('#fPlayers').value,10);
  if(name.length<3||contact.length<6||!(players>=2&&players<=30)){toast(t('tBadForm'),1);return}
  const btn=$('#sendBtn');btn.disabled=true;
  try{
    const id=await DB.createBooking({court:S.court,date:S.date,hour:S.hour,name,contact,players,purpose:$('#fPurpose').value,note:$('#fNote').value.trim()});
    addMy(id);toast(t('tSent'));S.hour=null;$('#fNote').value='';paintSlots();
    $('#mine').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(err){toast(err&&err.code==='taken'?t('tTaken'):t('tErr'),1)}
  btn.disabled=false;
}

  $('#chips').innerHTML=kinds.map(k=>'<button type="button" class="chp'+(S.filter===k?' on':'')+'" data-k="'+k+'">'+(k==='all'?'<i class="fa-solid fa-layer-group"></i>'+esc(t('all')):'<i class="fa-solid '+KIND[k].i+'"></i>'+esc(t(KIND[k].k)))+'</button>').join('');

function paintFeed(){
  const list=S.posts.filter(p=>S.filter==='all'||p.type===S.filter);
  $('#feedList').innerHTML=list.length?list.map(p=>{const K=KIND[p.type]||KIND.news;const link=/^https?:\/\//i.test(p.link||'')?'<a href="'+esc(p.link)+'" target="_blank" rel="noopener">'+'<i class="fa-solid fa-arrow-up-right-from-square"></i></a>':'';
    return '<article class="post reveal in"><span class="pt '+esc(p.type)+'"><i class="fa-solid '+K.i+'"></i>'+esc(t(K.k))+'</span><h3>'+esc(p.title)+'</h3>'+(p.date?'<div class="evd"><i class="fa-regular fa-calendar"></i>'+esc(fmtDate(p.date))+'</div>':'')+'<p>'+esc(p.body)+'</p><div class="pf"><span>'+(p.createdAt?new Date(p.createdAt).toLocaleDateString(locale()):'')+'</span>'+link+'</div></article>'}).join(''):'<div class="empty"><i class="fa-regular fa-newspaper"></i>'+esc(t('noPosts'))+'</div>';

      +(r.reply&&st!=='pending'?'<div class="reply"><b>'+esc(t('replyLbl'))+'</b> '+esc(r.reply)+'</div>':'')+'</div>'
      +'<div class="acts">'+(st==='pending'?'<textarea placeholder="'+esc(t('replyPh'))+'" maxlength="200"></textarea><div class="r2"><button class="go" data-a="accepted" type="button"><i class="fa-solid fa-check"></i>'+esc(t('accept'))+'</button><button class="no" data-a="refused" type="button"><i class="fa-solid fa-xmark"></i>'+esc(t('refuse'))+'</button></div>':
        '<div class="r2"><button class="no" data-a="refused" type="button" '+(st==='refused'?'style="display:none"':'')+'><i class="fa-solid fa-ban"></i>'+esc(t('refuse'))+'</button><button class="go" data-a="accepted" type="button" '+(st==='accepted'?'style="display:none"':'')+'><i class="fa-solid fa-check"></i>'+esc(t('accept'))+'</button></div>')+'</div></div>'}).join(''):'<div class="empty"><i class="fa-solid fa-inbox"></i>'+esc(t('noReqs'))+'</div>';
  $$('#reqList .areq').forEach(card=>{card.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const ta=card.querySelector('textarea');try{await DB.setStatus(card.dataset.id,b.dataset.a,ta?ta.value.trim():'');toast(t('tDone'))}catch(e){toast(t('tErr'),1)}})});
}
function paintPostsAdmin(){
  $('#postsAdmin').innerHTML=S.posts.length?S.posts.map(p=>'<div class="it"><div><b>'+esc(p.title)+'</b><small>'+esc(t((KIND[p.type]||KIND.news).k))+(p.date?' · '+esc(p.date):'')+'</small></div><button class="del" data-id="'+esc(p.id)+'" type="button" aria-label="'+esc(t('del'))+'"><i class="fa-solid fa-trash"></i></button></div>').join(''):'<div class="empty"><i class="fa-regular fa-newspaper"></i>'+esc(t('noPosts'))+'</div>';
  $$('#postsAdmin .del').forEach(b=>b.onclick=()=>DB.delPost(b.dataset.id).then(()=>toast(t('tDone'))).catch(()=>toast(t('tErr'),1)));
}
let blocked=[];
function paintBlocked(){
  const l=blocked.slice().sort((a,b)=>(a.date+a.hour).localeCompare(b.date+b.hour));
  $('#blockedList').innerHTML=l.length?l.map(s=>'<div class="it"><div><b>'+esc(t((COURT[s.court]||COURT.foot).k))+'</b><small>'+esc(fmtDate(s.date))+' · <span dir="ltr">'+slotLabel(s.hour)+'</span></small></div><button class="sm" data-id="'+esc(s.id)+'" type="button"><i class="fa-solid fa-lock-open"></i>'+esc(t('reopen'))+'</button></div>').join(''):'<div class="empty"><i class="fa-solid fa-lock-open"></i>–</div>';
  $$('#blockedList .sm').forEach(b=>b.onclick=()=>DB.unblock(b.dataset.id).then(()=>toast(t('tDone'))).catch(()=>toast(t('tErr'),1)));
}
function fillBlockSlots(){$('#bSlot').innerHTML=HOURS.map(h=>'<option value="'+h+'">'+slotLabel(h)+'</option>').join('')}
function enterAdmin(){
  closeModal('loginModal');openModal('admin');document.body.style.overflow='hidden';
  adminUn.forEach(f=>f&&f());adminUn=[];
  adminUn.push(DB.subscribeBookings(l=>{S.reqs=l;paintReqChips();paintReqs()}));
  adminUn.push(DB.subscribeBlocked(l=>{blocked=l;paintBlocked()}));
  paintPostsAdmin();
}
function leaveAdmin(){closeModal('admin');document.body.style.overflow='';adminUn.forEach(f=>f&&f());adminUn=[]}

function applyLang(){
  const d=T[LANG],r=document.documentElement;
  r.dir=LANG==='ar'?'rtl':'ltr';r.lang=LANG;document.body.dataset.lang=LANG;
  ['ar','fr','en'].forEach(l=>$('#btn-'+l).classList.toggle('on',l===LANG));
  $$('[data-i18n]').forEach(el=>{const v=d[el.dataset.i18n];if(v!==undefined)el.innerHTML=v});
  document.title=d.title;
}
function changeLanguage(l){
  LANG=T[l]?l:'ar';try{localStorage.setItem('enstp-lang',LANG)}catch(e){}
  applyLang();buildDays();watchSlots();fillBlockSlots();paintChips();paintFeed();paintMine();paintSummary();
  if($('#admin').classList.contains('open')){paintReqChips();paintReqs();paintPostsAdmin();paintBlocked()}
}
function toggleTheme(){
  const r=document.documentElement,next=r.dataset.theme==='dark'?'light':'dark';
  r.dataset.theme=next;$('#metaTheme').content=next==='dark'?'#040b17':'#f3f6fc';
  try{localStorage.setItem('enstp-theme',next)}catch(e){}
}

function start(){
  DB=DEMO?makeDemo():makeFirebase();
  if(DEMO)$('#demoBox').classList.add('show');
  let s='ar';try{s=localStorage.getItem('enstp-lang')||'ar'}catch(e){}
  LANG=T[s]?s:'ar';applyLang();
  $('#metaTheme').content=document.documentElement.dataset.theme==='dark'?'#040b17':'#f3f6fc';
  buildDays();fillBlockSlots();paintChips();paintSummary();
  watchSlots();liveCounts();
  DB.subscribePosts(l=>{S.posts=l;paintFeed();if(isAdmin)paintPostsAdmin()});
  myIds().forEach(watchMy);
  /* أحداث */
  $$('.opt').forEach(o=>o.onclick=()=>pickCourt(o.dataset.c));
  $$('[data-pick]').forEach(a=>a.addEventListener('click',()=>pickCourt(a.dataset.pick)));
  $('#bform').addEventListener('submit',submitBooking);
  $('#admBtn').onclick=()=>{$('#loginErr').textContent='';isAdmin?enterAdmin():openModal('loginModal')};
  $$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
  $$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const em=$('#lEmail').value.trim(),pw=$('#lPass').value;
    if(!DEMO&&(!em||!pw)){$('#loginErr').textContent=t('tFill');return}
    try{await DB.login(em,pw);$('#loginErr').textContent='';$('#lPass').value=''}catch(err){$('#loginErr').textContent=err&&err.code==='notmgr'?t('eNotMgr'):t('eAuth')}});
  DB.onAuth(ok=>{const was=isAdmin;isAdmin=ok;if(ok&&!was&&$('#loginModal').classList.contains('open'))enterAdmin();if(!ok&&was)leaveAdmin()});
  $('#admClose').onclick=leaveAdmin;$('#admOut').onclick=()=>DB.logout();
  $$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $('#postForm').addEventListener('submit',async e=>{e.preventDefault();const title=$('#pTitle').value.trim(),body=$('#pBody').value.trim();
    if(title.length<3||body.length<3){toast(t('tFill'),1);return}
    const link=$('#pLink').value.trim();
    try{await DB.addPost({type:$('#pType').value,title,body,date:$('#pDate').value||'',link:/^https?:\/\//i.test(link)?link:''});toast(t('tPosted'));e.target.reset()}catch(err){toast(t('tErr'),1)}});
  $('#blockForm').addEventListener('submit',async e=>{e.preventDefault();const d=$('#bDate').value;if(!d){toast(t('tFill'),1);return}
    try{await DB.blockSlot($('#bCourt').value,d,parseInt($('#bSlot').value,10));toast(t('tDone'))}catch(err){toast(err&&err.code==='taken'?t('tTaken'):t('tErr'),1)}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){$$('.modal.open').forEach(m=>m.classList.remove('open'))}});
  /* تأثيرات */
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  $$('.reveal').forEach(el=>io.observe(el));
  const pb=$('#progressBar'),tt=$('#toTop');
  addEventListener('scroll',()=>{const h=document.documentElement;pb.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%';tt.classList.toggle('show',h.scrollTop>600)},{passive:true});
  setInterval(()=>{if(S.date===dstr(new Date()))paintSlots()},60000);
}
/* لغة مبدئية قبل تحميل Firebase */
(function(){let s='ar';try{s=localStorage.getItem('enstp-lang')||'ar'}catch(e){}LANG=T[s]?s:'ar';applyLang()})();
window.addEventListener('DOMContentLoaded',()=>ready(start));
</script>
</body>
</html>

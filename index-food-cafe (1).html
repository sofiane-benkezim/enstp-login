<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المطاعم والمقاهي - ENSTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }, accent: { 500: '#f59e0b' } },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .mapbox{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:12px;box-shadow:0 1px 3px 0 rgb(0 0 0 / 0.1); direction: ltr;}
        .mapbox svg{display:block;width:100%;height:auto}
        .g{stroke:#e2e8f0;stroke-width:1}.ring{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:10 8;opacity:.7}
        .rl{font-family:'Cairo',sans-serif;font-weight:500;fill:#64748b}
        .pt{cursor:pointer}.pt circle{fill:#fff;stroke-width:4}.pt text{font-family:'Cairo',sans-serif;font-weight:700;fill:#0a2347;text-anchor:middle;dominant-baseline:central}
        .pt.sel circle{fill:#f59e0b;stroke:#fff}
        [dir="rtl"] .card{border-right-width:6px;border-right-color:#f26a1b}
    </style>
</head>
<body class="font-cairo bg-slate-50 text-slate-800 antialiased">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <img src="https://enstp.edu.dz/themes/custom/corporate3/logo.png" alt="شعار ENSTP" class="h-12 w-auto object-contain">
                    <span class="text-xl font-black text-brand-900 block">دليل المطاعم والمقاهي</span>
                </div>
                <a href="index.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right"></i> العودة للموقع الرئيسي
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="grid lg:grid-cols-12 gap-6 items-start">
            <div class="lg:col-span-5 mapbox sticky top-24" id="map"></div>
            <div class="lg:col-span-7" id="list"></div>
        </div>
    </main>

    <script>
        const O={lat:36.7255818,lng:3.0695956};
        const W=(a,b,f)=>{const x=[[a,b]];return[x,x,x,x,x,f===undefined?x:f,x]};
        const P=[
            {c:"food",n:"Zaou Fast Food",t:"وجبات سريعة وبيتزا",h:"9h-22h، مغلق الجمعة",lat:36.7291726,lng:3.0749554},
            {c:"food",n:"Pizza ON EST LA",t:"بيتزا للأخذ",h:"10h-23h",lat:36.7293919,lng:3.0745793},
            {c:"food",n:"El pato pizza",t:"بيتزا مفتوح حتى وقت متأخر",h:"يوميًا 11h-1h",lat:36.7296762,lng:3.0747027},
            {c:"cafe",n:"Zohir cafe",t:"مقهى",lat:36.7263996,lng:3.0708409},
            {c:"cafe",n:"Celtic Coffee",t:"مقهى",lat:36.7292067,lng:3.0727508},
            {c:"cafe",n:"Buono Gelato",t:"محل مثلجات",h:"11h-24h",lat:36.7297502,lng:3.0745068}
        ].map((p,i)=>{const dx=(p.lng-O.lng)*89200,dy=(p.lat-O.lat)*111000;return{...p,i,dx,dy,d:Math.hypot(dx,dy),r:i+1}});

        let sel=null;
        function plan(){
            let s=`<svg viewBox="0 200 450 600" role="img">`;
            P.forEach(p=>{
                let X=70+p.dx, Y=530-p.dy;
                s+=`<g class="pt${sel===p.i?" sel":""}" onclick="pick(${p.i})"><circle cx="${X}" cy="${Y}" r="16" stroke="#f26a1b" stroke-width="4"/><text x="${X}" y="${Y}">${p.r}</text></g>`;
            });
            return s+`<circle cx="70" cy="530" r="20" fill="#f59e0b" stroke="#0a2347" stroke-width="3"/><text x="105" y="522" style="font:700 16px Cairo;fill:#0a2347">ENSTP</text></svg>`;
        }
        function render(){
            document.getElementById('map').innerHTML=plan();
            document.getElementById('list').innerHTML=P.map(p=>`
                <article class="card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-4" style="border-right:6px solid #f26a1b" id="p${p.i}">
                    <div class="flex justify-between items-start">
                        <div class="flex gap-3">
                            <span class="w-8 h-8 rounded-full bg-orange-50 text-orange-600 font-bold flex items-center justify-center text-sm">${p.r}</span>
                            <div>
                                <h3 class="font-bold text-slate-900 text-base">${p.n}</h3>
                                <p class="text-xs text-slate-500 font-semibold">${p.t}</p>
                            </div>
                        </div>
                        <span class="font-bold text-sm text-slate-700">≈ ${Math.round(p.d)} متر</span>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <a href="https://www.google.com/maps/dir/?api=1&origin=${O.lat},${O.lng}&destination=${p.lat},${p.lng}" target="_blank" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700 transition">الطريق مشيًا</a>
                    </div>
                </article>
            `).join('');
        }
        function pick(i){sel=i;render();document.getElementById("p"+i).scrollIntoView({behavior:"smooth",block:"center"});}
        render();
    </script>
</body>
</html>

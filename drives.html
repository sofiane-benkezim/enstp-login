<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fc" id="metaTheme">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("enstp-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>مصادر الدراسة - دليل ENSTP الشامل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== ENSTP — نظام التصميم الموحد (نفس الصفحة الرئيسية) ===== */
:root{
--bg:#f3f6fc;--ink:#1b2a47;--muted:#5a6b88;--head:#0b1d3a;
--gold:#f5b841;--gold-2:#ffdf9a;--cyan:#38bdf8;--violet:#8b7bff;
--glass-b:rgba(20,50,110,.13);--radius:26px;--ease:cubic-bezier(.22,1,.36,1);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#d6e6ff 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#e6eeff 0%,transparent 60%),#f3f6fc;
--au-op:.55;--grid:rgba(40,80,160,.08);
--bar:rgba(255,255,255,.72);--bar-s:rgba(255,255,255,.92);
--bar-shadow:0 14px 40px rgba(20,50,110,.14);--bar-inset:rgba(255,255,255,.9);
--logo-grad:linear-gradient(100deg,#0b1d3a,#b9770e);
--soft:rgba(20,50,110,.05);--soft-b:rgba(20,50,110,.1);--nav-c:#41547a;
--hero-o1:rgba(8,26,60,.5);--hero-o2:rgba(8,26,60,.82);
--card:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,255,255,.72));
--card-b:rgba(20,50,110,.11);--card-shadow:0 20px 50px rgba(20,50,110,.13);
--card-shadow-h:0 34px 70px rgba(20,50,110,.2),0 0 50px rgba(245,184,65,.18);
--desc:#53648a;--tag-c:#a8650a;--icon-ring:#fff;--img-fade:rgba(8,22,50,.55);
--btn-c:#1e3358;--toggle-bg:#0b1d3a;--toggle-c:#ffdf9a;
}
html[data-theme="dark"]{
--bg:#040b17;--ink:#e8eef9;--muted:#8fa3c0;--head:#fff;--glass-b:rgba(255,255,255,.12);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#0d2a52 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#0a1d3d 0%,transparent 60%),#040b17;
--au-op:1;--grid:rgba(120,160,220,.07);
--bar:rgba(8,18,36,.55);--bar-s:rgba(5,12,26,.85);--bar-shadow:0 18px 50px rgba(0,0,0,.35);--bar-inset:rgba(255,255,255,.08);
--logo-grad:linear-gradient(100deg,#fff,#ffdf9a);
--soft:rgba(255,255,255,.05);--soft-b:rgba(255,255,255,.1);--nav-c:#b9c8df;
--hero-o1:rgba(4,11,23,.55);--hero-o2:rgba(4,11,23,.92);
--card:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
--card-b:rgba(255,255,255,.1);--card-shadow:0 22px 60px rgba(0,0,0,.35);
--card-shadow-h:0 36px 80px rgba(0,0,0,.5),0 0 60px rgba(245,184,65,.12);
--desc:#9db0cd;--tag-c:#ffdf9a;--icon-ring:#0a1730;--img-fade:rgba(4,11,23,.92);
--btn-c:#dbe7fb;--toggle-bg:#ffdf9a;--toggle-c:#14100a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body[data-lang="fr"],body[data-lang="en"]{font-family:'Inter','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#101828}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* خلفية حية */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--au-bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#1d5fd1;top:-120px;inset-inline-start:-80px;opacity:calc(.38*var(--au-op))}
.aurora i:nth-child(2){width:460px;height:460px;background:#7c4dff;top:45%;inset-inline-end:-120px;animation-duration:28s;opacity:calc(.28*var(--au-op))}
.aurora i:nth-child(3){width:420px;height:420px;background:#f5b841;bottom:-160px;inset-inline-start:30%;animation-duration:32s;opacity:calc(.16*var(--au-op))}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:200}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--violet));box-shadow:0 0 18px var(--gold)}

/* الشريط العلوي */
header{position:fixed;top:14px;inset-inline:0;z-index:150;padding:0 14px}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 14px;border-radius:22px;background:var(--bar);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--bar-shadow),inset 0 1px 0 var(--bar-inset)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{background:#fff;border-radius:14px;padding:5px 9px;box-shadow:0 6px 20px rgba(0,0,0,.3);flex-shrink:0}
.logo-img img{height:38px;width:auto;object-fit:contain}
#txt-brand{font-weight:900;font-size:1.05rem;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;font-size:.78rem;font-weight:800;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);white-space:nowrap;transition:.3s}
.back:hover{color:#111;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px rgba(245,184,65,.35)}
[dir="rtl"] .back i{transform:scaleX(-1)}
.lang{display:flex;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--soft-b)}
.lang button{font:inherit;font-size:.74rem;font-weight:800;padding:7px 11px;border-radius:10px;border:0;cursor:pointer;color:var(--nav-c);background:transparent;transition:.3s}
.lang button.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111;box-shadow:0 4px 14px rgba(245,184,65,.4)}
.theme-btn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--soft-b);cursor:pointer;overflow:hidden;background:var(--toggle-bg);color:var(--toggle-c);display:grid;place-items:center;flex-shrink:0;transition:transform .35s var(--ease)}
.theme-btn:hover{transform:translateY(-2px) rotate(-8deg)}
.theme-btn i{position:absolute;transition:transform .6s var(--ease),opacity .4s}
.theme-btn .i-sun{transform:translateY(130%) rotate(-90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-moon{transform:translateY(-130%) rotate(90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-sun{transform:none;opacity:1}

/* الواجهة */
.hero{position:relative;min-height:62svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate;padding:150px 20px 90px}
.hero-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,var(--hero-o1),var(--hero-o2)),url('photo11.jpg') center/cover no-repeat,linear-gradient(135deg,#0b2545,#1d5288)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 72%,var(--bg) 100%)}
.hero-inner{max-width:900px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:800;color:var(--gold-2);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(245,184,65,.4);backdrop-filter:blur(14px);margin-bottom:24px}
.hero h1{font-weight:900;font-size:clamp(1.9rem,5vw,3.6rem);line-height:1.35;color:#fff;text-wrap:balance;margin-bottom:22px;text-shadow:0 10px 50px rgba(0,0,0,.6)}
.hero h1 span{display:block;background:linear-gradient(100deg,#fff 0%,var(--gold-2) 40%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9d6ea;font-size:clamp(.95rem,1.5vw,1.08rem);line-height:2.05;max-width:760px;margin:0 auto}

main{max-width:1280px;margin:0 auto;padding:40px 20px 40px;display:flex;flex-direction:column;gap:90px}
.sec-head{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.sec-icon{flex-shrink:0;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:1.5rem;color:#fff;position:relative;background:linear-gradient(145deg,var(--c1,#2563eb),var(--c2,#38bdf8));box-shadow:0 14px 40px var(--c3,rgba(37,99,235,.45)),inset 0 1px 0 rgba(255,255,255,.4)}
.sec-icon::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:1px solid var(--c1,#2563eb);opacity:.35}
.sec-head h2{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:900;line-height:1.4;color:var(--head)}
.sec-head p{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:640px}
.sec-line{height:3px;width:90px;margin-top:12px;border-radius:3px;background:linear-gradient(270deg,var(--gold),transparent)}
[dir="ltr"] .sec-line{background:linear-gradient(90deg,var(--gold),transparent)}
.s-a{--c1:#2563eb;--c2:#38bdf8;--c3:rgba(37,99,235,.5)}
.s-b{--c1:#6d5cff;--c2:#b093ff;--c3:rgba(109,92,255,.5)}
.s-c{--c1:#059669;--c2:#34d399;--c3:rgba(5,150,105,.5)}
.s-d{--c1:#d97706;--c2:#fbbf24;--c3:rgba(217,119,6,.5)}

/* البطاقات */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
@media(max-width:992px){.two{grid-template-columns:1fr}}
.box{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);padding:32px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow)}
.box h3.t{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:900;color:var(--head);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--card-b)}
.box h3.t i{color:var(--gold)}
.box p{color:var(--desc);font-size:.92rem;line-height:2;margin-bottom:14px}
.director{display:flex;gap:22px;align-items:center;background:var(--soft);border:1px solid var(--card-b);padding:22px;border-radius:20px;margin-top:10px}
.director img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 25px rgba(245,184,65,.4);flex-shrink:0}
.director h4{font-size:1.1rem;font-weight:900;color:var(--head);margin-bottom:4px}
.director small{display:block;font-size:.78rem;color:var(--tag-c);font-weight:800;margin-bottom:6px}
.director p{font-size:.82rem;line-height:1.8;margin:0}
@media(max-width:600px){.director{flex-direction:column;text-align:center}}

.search-card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.search-card:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.card-image-wrap{position:relative;height:220px;overflow:hidden;background:linear-gradient(135deg,#0b2545,#1d5288)}
.card-image{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s;filter:saturate(1.05) brightness(.95)}
.search-card:hover .card-image{transform:scale(1.1);filter:saturate(1.25) brightness(1.05)}
.card-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--img-fade) 100%)}
.card-content{padding:18px 20px 20px}
.card-title{font-size:.98rem;font-weight:800;line-height:1.7;color:var(--head);text-align:center}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:auto;padding:15px 18px;border-radius:16px;font-weight:900;font-size:.9rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 14px 36px rgba(245,184,65,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s var(--ease),box-shadow .35s}
.btn:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(245,184,65,.55)}

footer{position:relative;margin-top:50px;padding:70px 20px 46px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#12386a 0%,transparent 65%),#030812}
footer::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 30px var(--gold)}
.f-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:1.6rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 14px 40px rgba(245,184,65,.4)}
#footer-title{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:6px}
#footer-sub{font-size:.85rem;color:#8fa3c0;max-width:520px;margin:0 auto}
.to-top{position:fixed;bottom:22px;inset-inline-end:18px;z-index:140;width:48px;height:48px;border-radius:16px;border:1px solid var(--glass-b);cursor:pointer;color:var(--tag-c);background:var(--bar-s);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(20px);transition:.4s var(--ease)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top:hover{background:var(--gold);color:#111}

.reveal{opacity:0;translate:0 40px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.reveal.in{opacity:1;translate:0 0}

@media(max-width:640px){
header{top:8px;padding:0 8px}
.bar{padding:7px 9px;border-radius:18px;gap:8px}
.logo-img img{height:30px}
#txt-brand{display:none}
.back span{display:none}
.lang button{padding:6px 8px;font-size:.68rem}
.hero{padding:120px 18px 70px}
main{gap:70px}
.card-image-wrap{height:190px}
.box{padding:24px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;translate:0 0}}

.hero{min-height:50svh}
.s-e{--c1:#059669;--c2:#34d399;--c3:rgba(5,150,105,.5)}
.s-f{--c1:#7c3aed;--c2:#c4b5fd;--c3:rgba(124,58,237,.5)}
.s-r{--c1:#dc2626;--c2:#f87171;--c3:rgba(220,38,38,.5)}
.yr{display:flex;flex-direction:column;justify-content:space-between;border-radius:var(--radius);padding:28px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.yr:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.yr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.chip{font-size:.72rem;font-weight:800;padding:6px 13px;border-radius:999px;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 16px rgba(245,184,65,.35)}
.ico{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:1.3rem;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 12px 28px var(--c3),inset 0 1px 0 rgba(255,255,255,.4)}
.yr h3{font-size:1.15rem;font-weight:900;color:var(--head);line-height:1.6;margin-bottom:8px}
.yr p{font-size:.86rem;line-height:1.95;color:var(--desc);margin-bottom:22px}
.links{display:grid;gap:10px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-radius:14px;font-size:.86rem;font-weight:800;color:var(--btn-c);background:var(--soft);border:1px solid var(--card-b);transition:.3s var(--ease)}
.lk i.l{color:var(--gold);margin-inline-end:10px}
.lk i.x{font-size:.7rem;opacity:.6}
.lk:hover{color:#14100a;border-color:var(--gold);background:linear-gradient(135deg,var(--gold-2),var(--gold));transform:translateY(-2px);box-shadow:0 10px 26px rgba(245,184,65,.3)}
.lk:hover i.l{color:#14100a}
.lk.big{padding:16px;font-size:.92rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);border:0;box-shadow:0 14px 36px rgba(245,184,65,.4)}
.lk.big i.l{color:#14100a}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lk.sm{justify-content:center;padding:11px;font-size:.78rem}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.rs{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:20px;border-radius:20px;background:var(--soft);border:1px solid var(--card-b);transition:.35s var(--ease)}
.rs:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:var(--card-shadow-h)}
.rs .t{display:flex;align-items:center;gap:12px;font-weight:800;font-size:.92rem;color:var(--head)}
.rs .t i{font-size:1.3rem}
.rs .go{font-size:.78rem;font-weight:800;color:var(--tag-c)}
.rs .go i{font-size:.6rem;margin-inline-start:4px}
[dir="rtl"] .rs .go i{transform:scaleX(-1)}
.sec-head h2{font-size:clamp(1.3rem,3vw,1.9rem)}
main{gap:80px}

/* ===== ملفات الطلبة ===== */
.hidden{display:none!important}
.hero-cta{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:15px 28px;border-radius:16px;font-weight:900;font-size:.92rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 14px 36px rgba(245,184,65,.45);transition:.3s var(--ease);cursor:pointer;border:0;font-family:inherit}
.hero-cta:hover{transform:translateY(-3px)}
.cm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.cm-top .sec-head{margin-bottom:0}
.cm-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:16px;font:inherit;font-weight:900;font-size:.9rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);border:0;cursor:pointer;box-shadow:0 14px 36px rgba(245,184,65,.4);transition:.3s var(--ease)}
.cm-btn:hover{transform:translateY(-3px)}
.cm-demo{display:none;margin-bottom:16px;padding:12px 16px;border-radius:16px;font-size:.78rem;font-weight:800;line-height:1.9;color:#92400e;background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.5)}
.cm-demo.show{display:block}
html[data-theme="dark"] .cm-demo{color:var(--gold-2)}
.cm-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;padding:14px;border-radius:22px;background:var(--bar-s);border:1px solid var(--glass-b);box-shadow:var(--bar-shadow);margin-bottom:14px}
@media(max-width:860px){.cm-filters{grid-template-columns:1fr 1fr}.cm-filters .q{grid-column:1/-1}}
.cm-filters input,.cm-filters select,.cm-f input,.cm-f select,.cm-f textarea{width:100%;font:inherit;font-size:.9rem;padding:12px 14px;border-radius:14px;background:var(--soft);border:1.5px solid var(--card-b);color:var(--ink);outline:none;transition:.25s}
.cm-f textarea{resize:vertical;min-height:80px}
.cm-filters input:focus,.cm-filters select:focus,.cm-f input:focus,.cm-f select:focus,.cm-f textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,184,65,.18)}
.cm-filters select option,.cm-f select option{color:#111}
.cm-count{font-size:.8rem;font-weight:800;color:var(--muted);margin:0 4px 16px}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.fc{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:24px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.fc:hover{transform:translateY(-6px);box-shadow:var(--card-shadow-h)}
.fc-top{display:flex;gap:14px;align-items:flex-start}
.fi{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;color:#fff;background:var(--fc,#64748b)}
.fc h3{font-size:.98rem;font-weight:900;color:var(--head);line-height:1.6;word-break:break-word}
.fc .sb{font-size:.76rem;font-weight:800;color:var(--tag-c)}
.fc .ds{font-size:.82rem;line-height:1.85;color:var(--desc);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:999px;color:var(--muted);background:var(--soft);border:1px solid var(--card-b)}
.tags span.y{color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));border-color:transparent}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;font-weight:700;color:var(--muted);padding-top:10px;border-top:1px solid var(--card-b);margin-top:auto}
.fmeta span{display:inline-flex;gap:6px;align-items:center}
.fmeta i{color:var(--gold)}
.fact{display:flex;gap:8px}
.fdl{flex:1;display:inline-flex;gap:9px;align-items:center;justify-content:center;padding:12px;border-radius:14px;font:inherit;font-weight:900;font-size:.84rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 10px 24px rgba(245,184,65,.35);transition:.3s var(--ease);cursor:pointer;border:0}
.fdl:hover{transform:translateY(-3px)}
.fsm{font:inherit;cursor:pointer;width:42px;border-radius:13px;color:var(--ink);background:var(--soft);border:1px solid var(--card-b);transition:.25s}
.fsm:hover{background:var(--gold);color:#111;border-color:transparent}
.fsm.bad:hover{background:#ef4444;color:#fff}
.cm-empty{grid-column:1/-1;text-align:center;padding:46px 20px;border-radius:26px;border:2px dashed var(--card-b);color:var(--muted);font-weight:700}
.cm-empty i{display:block;font-size:2.2rem;margin-bottom:12px;color:var(--gold)}
.cm-more{display:block;margin:22px auto 0;padding:12px 26px;border-radius:14px;font:inherit;font-weight:800;color:var(--btn-c);background:var(--soft);border:1px solid var(--card-b);cursor:pointer}
.cm-more:hover{background:var(--gold);color:#111}
.cm-modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(3,8,18,.72);backdrop-filter:blur(8px)}
.cm-modal.open{display:flex}
@media(min-width:700px){.cm-modal{align-items:center;padding:20px}}
.cm-card{width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:26px;background:var(--bar-s);border:1px solid var(--glass-b);box-shadow:0 40px 100px rgba(0,0,0,.55);position:relative;animation:cmup .35s var(--ease)}
@media(min-width:700px){.cm-card{border-radius:28px}}
@keyframes cmup{from{transform:translateY(30px);opacity:0}}
.cm-card h3{font-size:1.2rem;font-weight:900;color:var(--head);display:flex;gap:10px;align-items:center;margin-bottom:6px;padding-inline-end:46px}
.cm-card h3 i{color:var(--gold)}
.cm-card .sub{font-size:.82rem;color:var(--muted);line-height:1.8;margin-bottom:14px}
.cm-x{position:absolute;top:16px;inset-inline-end:16px;width:38px;height:38px;border-radius:12px;border:1px solid var(--card-b);background:var(--soft);color:var(--ink);cursor:pointer}
.drop{display:block;text-align:center;padding:26px 16px;border-radius:20px;border:2px dashed var(--card-b);background:var(--soft);cursor:pointer;transition:.25s;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--gold);background:rgba(245,184,65,.1)}
.drop i{font-size:1.9rem;color:var(--gold);display:block;margin-bottom:6px}
.drop b{display:block;color:var(--head);font-size:.92rem;word-break:break-word}
.drop small{font-size:.72rem;color:var(--muted);font-weight:700}
.drop input{display:none}
.cm-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.cm-f{grid-template-columns:1fr}}
.cm-f .full{grid-column:1/-1}
.cm-f label{display:block;font-size:.7rem;font-weight:800;color:var(--muted);margin-bottom:5px}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:.78rem;line-height:1.8;font-weight:700;color:var(--ink);margin-top:14px;cursor:pointer}
.terms input{width:18px;height:18px;margin-top:4px;accent-color:#f5b841;flex-shrink:0}
.cm-err{color:#ef4444;font-size:.8rem;font-weight:800;min-height:20px;margin-top:10px}
.cm-bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px;display:none}
.cm-bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .3s}
.cm-go{display:flex;justify-content:flex-end;margin-top:16px}
.cm-go button{font:inherit;cursor:pointer;display:inline-flex;gap:9px;align-items:center;padding:14px 28px;border-radius:15px;border:0;font-weight:900;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 12px 30px rgba(245,184,65,.4)}
.cm-go button[disabled]{opacity:.55;cursor:wait}
.cm-toast{position:fixed;bottom:24px;left:50%;translate:-50% 30px;z-index:500;padding:14px 22px;border-radius:16px;font-weight:800;font-size:.86rem;color:#fff;background:#0b2545;border:1px solid rgba(245,184,65,.5);box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.4s var(--ease);max-width:92vw;text-align:center}
.cm-toast.show{opacity:1;translate:-50% 0}
.cm-toast.bad{background:#7f1d1d;border-color:#f87171}
</style>

function makeSupabase(){
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let uid=null;
  return{uid:()=>uid,
    async init(){let{data}=await sb.auth.getSession();if(!data.session){const r=await sb.auth.signInAnonymously();if(r.error)throw{code:'auth'};data=r.data}uid=(data.session||data).user.id;return uid},
    async list(){const{data,error}=await sb.from('study_files').select('*').eq('status','visible').order('created_at',{ascending:false}).limit(600);if(error)throw error;return(data||[]).map(r=>Object.assign({},r,{created_at:new Date(r.created_at).getTime()}))},
    async upload(file,meta,onP){
      const safe=file.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(-60),path=uid+'/'+Date.now()+'-'+safe;
      onP&&onP(.15);const up=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(up.error)throw up.error;onP&&onP(.8);
      const row=Object.assign({file_path:path,file_name:file.name,size:file.size,mime:file.type||null},meta);
      const{data,error}=await sb.from('study_files').insert(row).select().single();
      if(error){await sb.storage.from(BUCKET).remove([path]);throw error}onP&&onP(1);return Object.assign({},data,{created_at:new Date(data.created_at).getTime()})},
    async remove(id){const{data}=await sb.from('study_files').select('file_path').eq('id',id).maybeSingle();const{error}=await sb.from('study_files').delete().eq('id',id);if(error)throw error;if(data&&data.file_path)await sb.storage.from(BUCKET).remove([data.file_path])},
    async bump(id){await sb.rpc('bump_download',{p_id:id})},
    async report(id,reason){await sb.from('study_reports').insert({file_id:id,reason})},
    url(f){return sb.storage.from(BUCKET).getPublicUrl(f.file_path).data.publicUrl}};
}

async function startCommunity(){
  B=DEMO?makeDemo():makeSupabase();
  $('#cmDemo').classList.toggle('show',DEMO);
  try{UID=await B.init()}catch(e){console.error(e);const bar=document.createElement('div');bar.style.cssText='position:fixed;top:80px;inset-inline:12px;z-index:400;padding:12px 16px;border-radius:14px;background:#7f1d1d;color:#fff;font:800 .82rem Cairo,sans-serif;text-align:center';bar.textContent=tr('eAuth');document.body.appendChild(bar);setTimeout(()=>bar.remove(),8000)}
  fillSelects();resetForm();
  $('#cmQ').oninput=e=>{F.q=e.target.value;shown=PAGE;renderFiles()};$('#cmY').onchange=e=>{F.y=e.target.value;shown=PAGE;renderFiles()};$('#cmK').onchange=e=>{F.k=e.target.value;shown=PAGE;renderFiles()};$('#cmS').onchange=e=>{F.s=e.target.value;renderFiles()};
  $('#cmMore').onclick=()=>{shown+=PAGE;renderFiles()};
  $('#openUp').onclick=()=>{resetForm();$('#cmModal').classList.add('open')};$('#cmClose').onclick=()=>$('#cmModal').classList.remove('open');
  $('#cmModal').addEventListener('mousedown',e=>{if(e.target.id==='cmModal')$('#cmModal').classList.remove('open')});
  addEventListener('keydown',e=>{if(e.key==='Escape')$('#cmModal').classList.remove('open')});
  $('#cmFile').onchange=e=>pickFile(e.target.files[0]);
  const dr=$('#drop');['dragover','dragenter'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.add('over')}));['dragleave','drop'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.remove('over')}));
  dr.addEventListener('drop',e=>{if(e.dataTransfer.files[0])pickFile(e.dataTransfer.files[0])});
  $('#cmForm').addEventListener('submit',submitFile);document.addEventListener('click',onClick);
  setLanguage(L());await refresh();setInterval(()=>{if(!DEMO)refresh()},60000);
}
window.addEventListener('DOMContentLoaded',()=>{if(DEMO||window.supabase)startCommunity();else{const iv=setInterval(()=>{if(window.supabase){clearInterval(iv);startCommunity()}},60)}});

</script>

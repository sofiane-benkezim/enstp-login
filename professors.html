<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">قائمة الأساتذة</title>
    <!-- استيراد الأيقونات والخطوط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #2c3e50;
            padding: 40px 20px;
            transition: direction 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* شريط أزرار اللغات */
        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 25px;
        }

        .lang-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background-color: #0a66c2;
            border-color: #0a66c2;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(10, 102, 194, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #1e293b;
            font-size: 28px;
            font-weight: 700;
        }

        /* شبكة عرض البطاقات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* تصميم البطاقات */
        .profile-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #cbd5e1;
        }

        /* زر الإغلاق X */
        .close-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 2;
            transition: background 0.2s;
        }

        [dir="ltr"] .close-btn {
            left: auto;
            right: 12px;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        /* خلفية أعلى البطاقة */
        .card-header-bg {
            height: 80px;
            background: linear-gradient(135deg, #0a66c2 0%, #3b82f6 100%);
        }

        /* الصورة الشخصية */
        .avatar-container {
            position: relative;
            margin-top: -45px;
            display: flex;
            justify-content: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background-color: #f1f5f9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* محتوى المعلومات */
        .card-body {
            padding: 16px 20px;
            flex-grow: 1;
        }

        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .name {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }

        .verified-icon {
            color: #0a66c2;
            font-size: 14px;
        }

        .bio {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 12px;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* التفاصيل المشتركة / التخصص */
        .mutual-connections {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid #f1f5f9;
            padding: 10px 16px;
            background-color: #f8fafc;
        }

        .mutual-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        /* أزرار البطاقة السفلى */
        .card-footer {
            padding: 14px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            width: 100%;
            border-radius: 10px;
            padding: 8px 0;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .more-btn {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
        }
        .more-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .email-btn {
            background-color: #0a66c2;
            border: 1px solid #0a66c2;
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(10, 102, 194, 0.2);
        }
        .email-btn:hover {
            background-color: #004182;
            border-color: #004182;
        }
    </style>
</head>

        };

        function renderCards(lang) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const tUI = uiTranslations[lang];

            professorsData.forEach((prof) => {
                const data = prof[lang];
                const cardHTML = `
                    <div class="profile-card" id="card-${prof.id}">
                        <button class="close-btn" onclick="this.parentElement.style.display='none'" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
                        <div class="card-header-bg"></div>
                        <div class="avatar-container">
                            <img src="${prof.img}" alt="${data.name}" class="avatar">
                        </div>
                        <div class="card-body">
                            <div class="name-container">
                                <span class="name">${data.name}</span>
                                <i class="fa-solid fa-circle-check verified-icon" title="موثق"></i>
                            </div>
                            <p class="bio">${data.bio}</p>
                        </div>
                        <div class="mutual-connections">
                            <img src="https://via.placeholder.com/50/0a66c2/ffffff?text=+" alt="أيقونة" class="mutual-avatar">
                            <span>${data.tag}</span>
                        </div>
                        <div class="card-footer">
                            <a href="${prof.link}" target="_blank" class="btn-action more-btn">
                                <i class="fa-solid fa-arrow-left"></i> <span>${tUI.read_more}</span>
                            </a>
                            <a href="mailto:${prof.email}" class="btn-action email-btn">
                                <i class="fa-solid fa-envelope"></i> <span>${tUI.connect}</span>
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const body = document.body;
            if (lang === 'ar') {
                body.setAttribute('dir', 'rtl');
                body.setAttribute('lang', 'ar');
            } else {
                body.setAttribute('dir', 'ltr');
                body.setAttribute('lang', lang);
            }

            document.getElementById('page-title').innerText = uiTranslations[lang].title;
            document.getElementById('main-heading').innerText = uiTranslations[lang].heading;

            renderCards(lang);
        }

        // تشغيل العرض الافتراضي باللغة العربية

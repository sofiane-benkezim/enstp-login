<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل الجزائر العاصمة السياحي - ENSTP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
  --card-bg: rgba(30, 41, 59, 0.7);
  --card-border: rgba(255, 255, 255, 0.1);
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.35);
  --accent: #f59e0b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --radius: 20px;
  --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
  --font: 'Cairo', 'Plus Jakarta Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: #0f172a;
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font);
  min-height: 100vh;
  padding-bottom: 60px;
}

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 20px 28px;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 32px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px var(--primary-glow);
}

.brand-icon svg { width: 26px; height: 26px; stroke: #fff; }

.brand-title {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
  background: linear-gradient(to right, #fff, var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.lg-btn-group {
  display: flex;
  gap: 6px;
  background: rgba(255, 255, 255, 0.05);
  padding: 4px;
  border-radius: 30px;
  border: 1px solid var(--card-border);
}

.lg-btn-group button {
  border: none;
  background: transparent;
  padding: 8px 18px;
  border-radius: 20px;
  font-family: var(--font);
  font-weight: 700;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.lg-btn-group button[aria-pressed="true"] {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 0 15px var(--primary-glow);
}

/* Hero Section */
.hero {
  text-align: center;
  margin-bottom: 40px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 900;
  margin: 0 0 12px;
  background: linear-gradient(to right, #ffffff, #cbd5e1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  color: var(--text-muted);
  font-size: 16px;
  max-width: 600px;
  margin: 0 auto 24px;
}

.stats-bar {
  display: inline-flex;
  gap: 24px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--card-border);
  padding: 12px 28px;
  border-radius: 40px;
  backdrop-filter: blur(10px);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 14px;
}

.stat-item span { color: var(--accent); font-weight: 900; }

/* Search Box */
.search-container {
  max-width: 500px;
  margin: 24px auto 0;
  position: relative;
}

.search-container input {
  width: 100%;
  padding: 16px 24px;
  border-radius: 30px;
  border: 1px solid var(--card-border);
  background: rgba(15, 23, 42, 0.8);
  color: #fff;
  font-family: var(--font);
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
  box-shadow: var(--shadow);
}

.search-container input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 25px var(--primary-glow);
}

/* Places Grid */
.places-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 24px;
}

/* Touristic Card */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-8px);
  border-color: rgba(99, 102, 241, 0.4);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--primary-glow);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
}

.badge-num {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 12px var(--primary-glow);
}

.title-area h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
}

.place-type {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
}

.dist-badge {
  text-align: left;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}

.dist-badge small {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}

.info-group {
  margin: 16px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.info-item {
  font-size: 13px;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.info-item b { color: var(--text-muted); font-weight: 600; }

.review-card {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  color: #e2e8f0;
  border-right: 3px solid var(--primary);
  margin-top: 8px;
  line-height: 1.6;
}

.note-card {
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid rgba(245, 158, 11, 0.2);
  color: #fbbf24;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  margin-top: 10px;
}

.card-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
  text-align: center;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), #4f46e5);
  color: #fff;
  box-shadow: 0 4px 15px var(--primary-glow);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px var(--primary-glow);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  border: 1px solid var(--card-border);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
}

@media (max-width: 768px) {
  .places-grid { grid-template-columns: 1fr; }
  .header { flex-direction: column; text-align: center; }
}
</style>
</head>

// Calculate Distance from ENSTP
TOURIST_PLACES.forEach((p, idx) => {
  const dx = (p.lng - O.lng) * 89200;
  const dy = (p.lat - O.lat) * 111000;
  p.d = Math.hypot(dx, dy);
  p.id = idx + 1;
});

function distFormat(d) {
  if (d < 1000) return Math.round(d) + " م";
  return (d / 1000).toFixed(1) + " كم";
}

function renderPlaces() {
  const u = I[LG];
  const query = document.getElementById("search-input").value.toLowerCase();
  
  const filtered = TOURIST_PLACES.filter(p => {
    const name = p.n[LG] || p.n.ar;
    const type = p.t[LG] || p.t.ar;
    return name.toLowerCase().includes(query) || type.toLowerCase().includes(query);
  });

  const container = document.getElementById("places-container");
  
  if (filtered.length === 0) {
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding: 60px 20px; color: var(--text-muted);">
      <h3>لم يتم العثور على أي نتائج مطابقة للبحث</h3>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(p => {
    const name = p.n[LG] || p.n.ar;
    const type = p.t[LG] || p.t.ar;
    const hours = p.h ? (p.h[LG] || p.h.ar) : u.nohrs;
    const note = p.note ? (p.note[LG] || p.note.ar) : "";
    const review = p.rv ? (p.rv[LG] || p.rv.ar) : "";

    return `
      <article class="card">
        <div>
          <div class="card-top">
            <div style="display:flex; gap:12px; align-items:center;">
              <span class="badge-num">${p.id}</span>
              <div class="title-area">
                <h3>${name}</h3>
                <div class="place-type">${type}</div>
              </div>
            </div>
            <div class="dist-badge">
              ≈ ${distFormat(p.d)}
              <small>${u.bird}</small>
            </div>
          </div>

          <div class="info-group">
            <div class="info-item">
              <b>${u.hrs}</b> <span>${hours}</span>
            </div>
            ${p.ph ? `<div class="info-item"><b>${u.tel}</b> <bdi dir="ltr">${p.ph}</bdi></div>` : ''}
            ${p.rt ? `<div class="info-item"><b>${u.rat}</b> ★${p.rt[0]} (${p.rt[1]}${u.rvw})</div>` : ''}
          </div>

          ${review ? `<div class="review-card"><b>${u.rvl}</b><br>"${review}"</div>` : ''}
          ${note ? `<div class="note-card">📍 ${note}</div>` : ''}
        </div>

        <div class="card-actions">
          <a class="btn btn-primary" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${O.lat},${O.lng}&destination=${p.lat},${p.lng}&travelmode=driving">
            🚗 ${u.rT}
          </a>
          <a class="btn btn-secondary" target="_blank" href="${p.u}">
            🗺️ ${u.maps}
          </a>
        </div>
      </article>
    `;
  }).join('');
}

// Language Switch
document.getElementById("lg").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (btn) {
    LG = btn.dataset.l;
    document.documentElement.lang = LG;
    document.documentElement.dir = LG === "ar" ? "rtl" : "ltr";
    
    document.querySelectorAll("#lg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === LG)));
    
    const u = I[LG];
    document.getElementById("app-title").textContent = u.app;
    document.getElementById("hero-title").textContent = u.heroT;
    document.getElementById("hero-subtitle").textContent = u.heroS;
    document.getElementById("search-input").placeholder = u.search;
    
    renderPlaces();
  }
});

document.getElementById("search-input").addEventListener("input", renderPlaces);

// Initial Render
renderPlaces();
</script>

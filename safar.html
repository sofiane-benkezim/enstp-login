<!doctype html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040b17" id="metaTheme">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("enstp-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<title>ENSTP Safar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== ENSTP — نظام التصميم الموحد ===== */
:root{
--bg:#f3f6fc;--ink:#1b2a47;--muted:#5a6b88;--head:#0b1d3a;
--gold:#f5b841;--gold-2:#ffdf9a;--cyan:#38bdf8;--violet:#8b7bff;
--glass-b:rgba(20,50,110,.13);--radius:26px;--ease:cubic-bezier(.22,1,.36,1);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#d6e6ff 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#e6eeff 0%,transparent 60%),#f3f6fc;
--au-op:.55;--grid:rgba(40,80,160,.08);
--bar:rgba(255,255,255,.72);--bar-s:rgba(255,255,255,.92);
--bar-shadow:0 14px 40px rgba(20,50,110,.14);--bar-inset:rgba(255,255,255,.9);
--logo-grad:linear-gradient(100deg,#0b1d3a,#b9770e);
--soft:rgba(20,50,110,.05);--soft-b:rgba(20,50,110,.1);--nav-c:#41547a;
--hero-o1:rgba(8,26,60,.5);--hero-o2:rgba(8,26,60,.82);
--card:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,255,255,.72));
--card-b:rgba(20,50,110,.11);--card-shadow:0 20px 50px rgba(20,50,110,.13);
--card-shadow-h:0 34px 70px rgba(20,50,110,.2),0 0 50px rgba(245,184,65,.18);
--desc:#53648a;--tag-c:#a8650a;--icon-ring:#fff;--img-fade:rgba(8,22,50,.55);
--btn-c:#1e3358;--toggle-bg:#0b1d3a;--toggle-c:#ffdf9a;
}
html[data-theme="dark"]{
--bg:#040b17;--ink:#e8eef9;--muted:#8fa3c0;--head:#fff;--glass-b:rgba(255,255,255,.12);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#0d2a52 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#0a1d3d 0%,transparent 60%),#040b17;
--au-op:1;--grid:rgba(120,160,220,.07);
--bar:rgba(8,18,36,.55);--bar-s:rgba(5,12,26,.85);--bar-shadow:0 18px 50px rgba(0,0,0,.35);--bar-inset:rgba(255,255,255,.08);
--logo-grad:linear-gradient(100deg,#fff,#ffdf9a);
--soft:rgba(255,255,255,.05);--soft-b:rgba(255,255,255,.1);--nav-c:#b9c8df;
--hero-o1:rgba(4,11,23,.55);--hero-o2:rgba(4,11,23,.92);
--card:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
--card-b:rgba(255,255,255,.1);--card-shadow:0 22px 60px rgba(0,0,0,.35);
--card-shadow-h:0 36px 80px rgba(0,0,0,.5),0 0 60px rgba(245,184,65,.12);
--desc:#9db0cd;--tag-c:#ffdf9a;--icon-ring:#0a1730;--img-fade:rgba(4,11,23,.92);
--btn-c:#dbe7fb;--toggle-bg:#ffdf9a;--toggle-c:#14100a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body[data-lang="fr"],body[data-lang="en"]{font-family:'Inter','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#101828}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* خلفية حية */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--au-bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#1d5fd1;top:-120px;inset-inline-start:-80px;opacity:calc(.38*var(--au-op))}
.aurora i:nth-child(2){width:460px;height:460px;background:#7c4dff;top:45%;inset-inline-end:-120px;animation-duration:28s;opacity:calc(.28*var(--au-op))}
.aurora i:nth-child(3){width:420px;height:420px;background:#f5b841;bottom:-160px;inset-inline-start:30%;animation-duration:32s;opacity:calc(.16*var(--au-op))}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:200}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--violet));box-shadow:0 0 18px var(--gold)}

/* الشريط العلوي */
header{position:fixed;top:14px;inset-inline:0;z-index:150;padding:0 14px}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 14px;border-radius:22px;background:var(--bar);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--bar-shadow),inset 0 1px 0 var(--bar-inset)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{background:#fff;border-radius:14px;padding:5px 9px;box-shadow:0 6px 20px rgba(0,0,0,.3);flex-shrink:0}
.logo-img img{height:38px;width:auto;object-fit:contain}
#txt-brand{font-weight:900;font-size:1.05rem;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;font-size:.78rem;font-weight:800;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);white-space:nowrap;transition:.3s}
.back:hover{color:#111;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px rgba(245,184,65,.35)}
[dir="rtl"] .back i{transform:scaleX(-1)}
.lang{display:flex;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--soft-b)}
.lang button{font:inherit;font-size:.74rem;font-weight:800;padding:7px 11px;border-radius:10px;border:0;cursor:pointer;color:var(--nav-c);background:transparent;transition:.3s}
.lang button.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111;box-shadow:0 4px 14px rgba(245,184,65,.4)}
.theme-btn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--soft-b);cursor:pointer;overflow:hidden;background:var(--toggle-bg);color:var(--toggle-c);display:grid;place-items:center;flex-shrink:0;transition:transform .35s var(--ease)}
.theme-btn:hover{transform:translateY(-2px) rotate(-8deg)}
.theme-btn i{position:absolute;transition:transform .6s var(--ease),opacity .4s}
.theme-btn .i-sun{transform:translateY(130%) rotate(-90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-moon{transform:translateY(-130%) rotate(90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-sun{transform:none;opacity:1}

/* الواجهة */
.hero{position:relative;min-height:62svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate;padding:150px 20px 90px}
.hero-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,var(--hero-o1),var(--hero-o2)),url('photo11.jpg') center/cover no-repeat,linear-gradient(135deg,#0b2545,#1d5288)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 72%,var(--bg) 100%)}
.hero-inner{max-width:900px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:800;color:var(--gold-2);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(245,184,65,.4);backdrop-filter:blur(14px);margin-bottom:24px}
.hero h1{font-weight:900;font-size:clamp(1.9rem,5vw,3.6rem);line-height:1.35;color:#fff;text-wrap:balance;margin-bottom:22px;text-shadow:0 10px 50px rgba(0,0,0,.6)}
.hero h1 span{display:block;background:linear-gradient(100deg,#fff 0%,var(--gold-2) 40%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9d6ea;font-size:clamp(.95rem,1.5vw,1.08rem);line-height:2.05;max-width:760px;margin:0 auto}

main{max-width:1280px;margin:0 auto;padding:40px 20px 40px;display:flex;flex-direction:column;gap:90px}
.sec-head{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.sec-icon{flex-shrink:0;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:1.5rem;color:#fff;position:relative;background:linear-gradient(145deg,var(--c1,#2563eb),var(--c2,#38bdf8));box-shadow:0 14px 40px var(--c3,rgba(37,99,235,.45)),inset 0 1px 0 rgba(255,255,255,.4)}
.sec-icon::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:1px solid var(--c1,#2563eb);opacity:.35}
.sec-head h2{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:900;line-height:1.4;color:var(--head)}
.sec-head p{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:640px}
.sec-line{height:3px;width:90px;margin-top:12px;border-radius:3px;background:linear-gradient(270deg,var(--gold),transparent)}
[dir="ltr"] .sec-line{background:linear-gradient(90deg,var(--gold),transparent)}
.s-a{--c1:#2563eb;--c2:#38bdf8;--c3:rgba(37,99,235,.5)}
.s-b{--c1:#6d5cff;--c2:#b093ff;--c3:rgba(109,92,255,.5)}
.s-c{--c1:#059669;--c2:#34d399;--c3:rgba(5,150,105,.5)}
.s-d{--c1:#d97706;--c2:#fbbf24;--c3:rgba(217,119,6,.5)}

/* البطاقات */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
@media(max-width:992px){.two{grid-template-columns:1fr}}
.box{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);padding:32px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow)}
.box h3.t{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:900;color:var(--head);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--card-b)}
.box h3.t i{color:var(--gold)}
.box p{color:var(--desc);font-size:.92rem;line-height:2;margin-bottom:14px}
.director{display:flex;gap:22px;align-items:center;background:var(--soft);border:1px solid var(--card-b);padding:22px;border-radius:20px;margin-top:10px}
.director img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 25px rgba(245,184,65,.4);flex-shrink:0}
.director h4{font-size:1.1rem;font-weight:900;color:var(--head);margin-bottom:4px}
.director small{display:block;font-size:.78rem;color:var(--tag-c);font-weight:800;margin-bottom:6px}
.director p{font-size:.82rem;line-height:1.8;margin:0}
@media(max-width:600px){.director{flex-direction:column;text-align:center}}

.search-card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.search-card:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.card-image-wrap{position:relative;height:220px;overflow:hidden;background:linear-gradient(135deg,#0b2545,#1d5288)}
.card-image{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s;filter:saturate(1.05) brightness(.95)}
.search-card:hover .card-image{transform:scale(1.1);filter:saturate(1.25) brightness(1.05)}
.card-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--img-fade) 100%)}
.card-content{padding:18px 20px 20px}
.card-title{font-size:.98rem;font-weight:800;line-height:1.7;color:var(--head);text-align:center}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:auto;padding:15px 18px;border-radius:16px;font-weight:900;font-size:.9rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 14px 36px rgba(245,184,65,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s var(--ease),box-shadow .35s}
.btn:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(245,184,65,.55)}

footer{position:relative;margin-top:50px;padding:70px 20px 46px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#12386a 0%,transparent 65%),#030812}
footer::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 30px var(--gold)}
.f-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:1.6rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 14px 40px rgba(245,184,65,.4)}
#footer-title{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:6px}
#footer-sub{font-size:.85rem;color:#8fa3c0;max-width:520px;margin:0 auto}
.to-top{position:fixed;bottom:22px;inset-inline-end:18px;z-index:140;width:48px;height:48px;border-radius:16px;border:1px solid var(--glass-b);cursor:pointer;color:var(--tag-c);background:var(--bar-s);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(20px);transition:.4s var(--ease)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top:hover{background:var(--gold);color:#111}

.reveal{opacity:0;translate:0 40px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.reveal.in{opacity:1;translate:0 0}

@media(max-width:640px){
header{top:8px;padding:0 8px}
.bar{padding:7px 9px;border-radius:18px;gap:8px}
.logo-img img{height:30px}
#txt-brand{display:none}
.back span{display:none}
.lang button{padding:6px 8px;font-size:.68rem}
.hero{padding:120px 18px 70px}
main{gap:70px}
.card-image-wrap{height:190px}
.box{padding:24px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;translate:0 0}}


/* ===== ENSTP Safar ===== */
.hidden{display:none!important}
:root{--k1:#10b981;--k2:#3b82f6;--k3:#8b5cf6;--k4:#f59e0b;--good:#10b981;--bad:#ef4444}
.hero{min-height:auto;text-align:start;padding:132px 20px 70px}
.hero-bg{background:radial-gradient(900px 520px at 85% 0%,rgba(56,189,248,.3),transparent 60%),radial-gradient(700px 500px at 5% 100%,rgba(139,123,255,.28),transparent 60%),linear-gradient(135deg,#071a33,#0b2a52 55%,#10335f)}
.hero-bg::after{background:linear-gradient(180deg,transparent 70%,var(--bg) 100%)}
.hero-grid{max-width:1280px;width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,5.4vw,4.2rem);margin-bottom:20px}
.hero h1 .g{display:inline;background:linear-gradient(100deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:580px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.cta .btn{width:auto;margin:0;padding-inline:28px;border:0;cursor:pointer;font-family:inherit}
.btn-ghost{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:16px;font-weight:900;font-size:.9rem;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);transition:.3s var(--ease);cursor:pointer;font-family:inherit}
.btn-ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.16)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.stat{padding:12px 20px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);min-width:110px}
.stat b{display:block;font-family:'Inter',sans-serif;font-size:1.6rem;font-weight:900;color:var(--gold-2);line-height:1.2}
.stat span{font-size:.72rem;font-weight:800;color:#c9d6ea}
.vis{position:relative;border-radius:30px;padding:10px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
.vis svg{display:block;width:100%;height:auto}
.vis .rt{fill:none;stroke:rgba(255,255,255,.25);stroke-width:2.4;stroke-dasharray:3 9;stroke-linecap:round}
.vis .rt.on{stroke:var(--gold);stroke-dasharray:8 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.vis .city{fill:#fff;opacity:.9}
.vis text{font:800 11px 'Cairo',sans-serif;fill:#dbe7fb}
.pulse{animation:pl 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}

.sec-top h2{letter-spacing:-.2px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.hw{position:relative;padding:26px;border-radius:26px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow)}
.hw .n{position:absolute;top:18px;inset-inline-end:20px;font-family:'Inter',sans-serif;font-size:2.6rem;font-weight:900;color:var(--gold);opacity:.22}
.hw i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.3rem;color:#fff;margin-bottom:14px;background:linear-gradient(145deg,var(--c1,#2563eb),var(--c2,#38bdf8));box-shadow:0 12px 28px var(--c3,rgba(37,99,235,.4))}
.hw b{display:block;font-weight:900;color:var(--head);font-size:1rem;margin-bottom:4px}
.hw span{font-size:.84rem;color:var(--desc);line-height:1.9}

.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.kd{font:inherit;cursor:pointer;text-align:start;display:flex;gap:14px;align-items:center;padding:20px;border-radius:24px;color:var(--ink);background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.kd:hover{transform:translateY(-6px);box-shadow:var(--card-shadow-h)}
.kd i{flex:0 0 54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.4rem;color:#fff;background:var(--kc);box-shadow:0 12px 28px color-mix(in srgb,var(--kc) 45%,transparent)}
.kd b{display:block;font-weight:900;color:var(--head);font-size:.98rem;line-height:1.5}
.kd small{display:block;font-size:.76rem;color:var(--muted);font-weight:700;line-height:1.6;margin-top:2px}
.k-ride_offer{--kc:var(--k1)}.k-ride_request{--kc:var(--k2)}.k-carry_offer{--kc:var(--k3)}.k-parcel_request{--kc:var(--k4)}

/* الفلاتر */
.filters{position:sticky;top:78px;z-index:30;padding:14px;border-radius:24px;background:var(--bar);border:1px solid var(--glass-b);backdrop-filter:blur(20px);box-shadow:var(--bar-shadow);margin-bottom:24px}
@media(max-width:640px){.filters{top:64px;padding:10px}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;flex:0 0 auto;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-size:.78rem;font-weight:800;padding:9px 16px;border-radius:999px;color:var(--ink);background:var(--soft);border:1px solid var(--soft-b);transition:.25s}
.tab i{color:var(--kc,var(--gold))}
.tab.on{background:var(--kc,linear-gradient(135deg,var(--gold-2),var(--gold)));background:linear-gradient(135deg,var(--kc,#ffdf9a),var(--kc,#f5b841));color:#fff;border-color:transparent}
.tab.on i{color:#fff}
.tab[data-k=""].on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#14100a}

function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return t('justNow');const u=s<3600?[Math.floor(s/60),'m']:s<86400?[Math.floor(s/3600),'h']:[Math.floor(s/86400),'d'];return (LANG==='fr'||LANG==='ar'?t('ago')+' ':'')+u[0]+' '+t(u[1])+(LANG==='en'?' ago':'')}

function makeSupabase(){
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let uid=null;const subs=new Set();
  const fire=()=>subs.forEach(f=>f());
  const ts=r=>Object.assign({},r,{created_at:r.created_at?new Date(r.created_at).getTime():0});
  const chan=[];['trips','offers','messages'].forEach(tb=>chan.push(sb.channel('rt-'+tb).on('postgres_changes',{event:'*',schema:'public',table:tb},fire).subscribe()));
  setInterval(fire,25000);
  return{
    uid:()=>uid,
    async init(){let{data}=await sb.auth.getSession();if(!data.session){const r=await sb.auth.signInAnonymously();if(r.error)throw{code:'auth'};data=r.data}
      uid=(data.session||data).user.id;return uid},
    async getProfile(){const{data}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();return data},
    async saveProfile(p){const{error}=await sb.from('profiles').upsert(Object.assign({id:uid},p));if(error)throw error},
    async loadAll(){const min=dstr(new Date(Date.now()-30*864e5));
      const[a,b]=await Promise.all([sb.from('trips').select('*').gte('date',min).order('date').limit(400),sb.from('offers').select('*, trip:trips(*)').order('created_at',{ascending:false})]);
      return{trips:(a.data||[]).map(ts),offers:(b.data||[]).map(o=>Object.assign(ts(o),{trip:o.trip?ts(o.trip):null}))}},
    async createTrip(tr){const{data,error}=await sb.from('trips').insert(tr).select().single();if(error)throw error;return data},
    async updateTrip(id,p){const{error}=await sb.from('trips').update(p).eq('id',id);if(error)throw error},
    async deleteTrip(id){const{error}=await sb.from('trips').delete().eq('id',id);if(error)throw error},
    async createOffer(o){const{data,error}=await sb.from('offers').insert(o).select().single();if(error)throw{code:error.code==='23505'?'dup':'err'};
      await sb.from('messages').insert({offer_id:data.id,sender_name:o.from_name,kind:o.price!=null?'price':'text',body:o.message||'',price:o.price});return data},
    async setOffer(id,status,price){const p={status};if(price!=null)p.price=price;const{error}=await sb.from('offers').update(p).eq('id',id);if(error)throw error},
    async messages(oid){const{data}=await sb.from('messages').select('*').eq('offer_id',oid).order('created_at');return(data||[]).map(ts)},
    async send(oid,m){const{error}=await sb.from('messages').insert(Object.assign({offer_id:oid},m));if(error)throw error},
    async contact(oid){const{data}=await sb.rpc('get_contact',{p_offer:oid});return data&&data[0]||null},
    async report(id,reason){await sb.from('reports').insert({trip_id:id,reason})},
    async myRating(oid){const{data}=await sb.from('ratings').select('stars').eq('offer_id',oid).eq('from_uid',uid).maybeSingle();return data?data.stars:null},
    async rate(o,to,stars,comment){const{error}=await sb.from('ratings').insert({offer_id:o,to_uid:to,stars,comment});if(error)throw error},
    async summary(){const{data}=await sb.rpc('rating_summary');const m={};(data||[]).forEach(r=>m[r.uid]={s:r.avg*r.n,n:Number(r.n)});return m},
    onChange(fn){subs.add(fn)}
  };
}

function filtered(){
  const n=dstr(new Date()),tm=dstr(new Date(Date.now()+864e5)),wk=dstr(new Date(Date.now()+7*864e5)),q=S.q.trim().toLowerCase();
  let l=S.trips.filter(tr=>tr.status!=='cancelled'||mineTrip(tr));
  if(S.date==='past')l=l.filter(isPast);else l=l.filter(tr=>!isPast(tr)||mineTrip(tr)&&false);
  if(S.kind)l=l.filter(tr=>tr.kind===S.kind);
  if(S.dir)l=l.filter(tr=>tr.direction===S.dir);
  if(S.wil)l=l.filter(tr=>tr.wilaya===S.wil);
  if(S.date==='today')l=l.filter(tr=>tr.date===n);else if(S.date==='tomorrow')l=l.filter(tr=>tr.date===tm);else if(S.date==='week')l=l.filter(tr=>tr.date<=wk);
  if(q)l=l.filter(tr=>(wname(tr.wilaya)+' '+(WIL.find(x=>x[0]===tr.wilaya)||[]).join(' ')+' '+(tr.place||'')+' '+(tr.owner_name||'')+' '+(tr.note||'')+' '+(tr.item||'')).toLowerCase().includes(q));
  const sorters={soon:(a,b)=>(a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')),new:(a,b)=>b.created_at-a.created_at,cheap:(a,b)=>(a.price==null?1e9:a.price)-(b.price==null?1e9:b.price)};
  l.sort(sorters[S.sort]);
  if(S.date==='past')l.reverse();
  return l;
}

  let top='';
  if(o.status==='accepted'){const c=await B.contact(o.id);const ph=c&&c.phone?c.phone.replace(/[^\d+]/g,''):'';
    top='<div class="deal"><span>'+esc(t('dealOk'))+' · '+esc(t('agreed'))+': <b>'+(o.price!=null?esc(o.price)+' DA':'—')+'</b>'+(c?'<br>'+esc(c.name)+(ph?' · <bdi dir="ltr">'+esc(c.phone)+'</bdi>':''):'')+'</span>'+(ph?'<span style="display:flex;gap:8px"><a href="tel:'+esc(ph)+'"><i class="fa-solid fa-phone"></i>'+esc(t('call'))+'</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(ph.replace(/^0/,'213').replace('+',''))+'"><i class="fa-brands fa-whatsapp"></i>'+esc(t('wa'))+'</a></span>':'<small>'+esc(t('noPhone'))+'</small>')+'</div>'}
  else if(o.status==='pending'&&owner){const lp=lastPrice(msgs,o);top='<div class="decide"><span>'+esc(t('decideAsk'))+(lp!=null?' · <b>'+esc(lp)+' DA</b>':'')+'</span><button class="go" data-a="decide" data-s="accepted" data-p="'+(lp==null?'':lp)+'"><i class="fa-solid fa-check"></i>'+esc(t('accept'))+'</button><button class="go no" data-a="decide" data-s="declined"><i class="fa-solid fa-xmark"></i>'+esc(t('decline'))+'</button></div>'}
  else if(o.status!=='pending'){top='<div class="decide">'+statusChip(o.status)+'<span>'+esc(t('closedChat'))+'</span></div>'}
  if(o.status==='accepted'){const other=owner?o.from_uid:tr.owner,oname=owner?o.from_name:tr.owner_name,mr=await B.myRating(o.id);
    if(mr!=null)top+='<div class="decide"><span>'+'★'.repeat(mr)+'☆'.repeat(5-mr)+' · '+esc(t('rateThanks'))+'</span></div>';
    else if(!(document.activeElement&&document.activeElement.id==='rComment'))top+='<div class="decide" style="display:block"><b>'+esc(t('rateAsk',oname))+'</b><div class="pbar" id="rStars">'+[1,2,3,4,5].map(n=>'<button type="button" class="sm" data-a="star" data-n="'+n+'" style="font-size:1.1rem">☆</button>').join('')+'</div><div class="pbar"><input id="rComment" style="width:100%;font-family:inherit" maxlength="200" placeholder="'+esc(t('ratePh'))+'"><button class="go" type="button" data-a="rate" data-to="'+esc(other)+'" data-o="'+o.id+'" style="flex:0 0 auto"><i class="fa-solid fa-star"></i>'+esc(t('rateSend'))+'</button></div></div>'}
  $('#chatTop').innerHTML=top;
  const m=$('#msgs'),atEnd=m.scrollHeight-m.scrollTop-m.clientHeight<80||!soft;
  m.innerHTML=msgs.map(x=>{const me=x.sender===S.uid;return x.kind==='price'?'<div class="bub pr '+(me?'me':'you')+'"><i class="fa-solid fa-tag"></i><div><small>'+esc(me?'':x.sender_name+' ')+esc(t('priceProposed'))+'</small><b>'+esc(x.price)+' DA</b>'+(x.body&&x.body!==String(x.price)?'<br>'+esc(x.body):'')+'</div></div>':'<div class="bub '+(me?'me':'you')+'">'+esc(x.body)+'<small>'+esc(me?'':x.sender_name+' · ')+esc(ago(x.created_at))+'</small></div>'}).join('')||'<div class="bub sys">'+esc(t('sysOffer'))+'</div>';
  if(atEnd)m.scrollTop=m.scrollHeight;
  if(o.status==='pending'||o.status==='accepted'){
    if(!$('#cIn')||!soft){const lp=lastPrice(msgs,o);$('#chatBot').innerHTML='<form class="cin" id="cForm"><input id="cIn" maxlength="500" placeholder="'+esc(t('tMsg'))+'" autocomplete="off"><button type="submit" aria-label="'+esc(t('tSend'))+'"><i class="fa-solid fa-paper-plane"></i></button></form>'+(o.status==='pending'?'<div class="pbar"><i class="fa-solid fa-tag" style="color:var(--gold)"></i><input id="cPrice" type="number" min="0" max="200000" step="50" inputmode="numeric" placeholder="DA" value="'+(lp==null?'':lp)+'"><button class="sm" type="button" data-a="propose"><i class="fa-solid fa-hand-holding-dollar"></i>'+esc(t('propose'))+'</button></div>':'')}
  }else $('#chatBot').innerHTML='';
}

/* ───────── الأحداث ───────── */
async function onAction(e){
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  try{
  if(a==='offer')openOffer(id);
  else if(a==='manage'){openMine('trips')}
  else if(a==='share'){const u=location.origin+location.pathname+'?trip='+id;if(navigator.share)navigator.share({title:document.title,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast(t('copied')));else prompt('',u)}
  else if(a==='report'){const r=prompt(t('reportAsk'));if(r&&r.trim()){await B.report(id,r.trim().slice(0,300));toast(t('reported'))}}
  else if(a==='chat')openChat(id);
  else if(a==='withdraw'){await B.setOffer(id,'withdrawn');await refresh()}
  else if(a==='editprof')openProfile();
  else if(a==='st'){const p={status:b.dataset.s};await B.updateTrip(id,p);await refresh()}
  else if(a==='del'){if(confirm(t('confirmDel'))){await B.deleteTrip(id);await refresh()}}
  else if(a==='decide'){const o=S.offers.find(x=>x.id===S.chat),st=b.dataset.s,p=b.dataset.p===''?null:parseInt(b.dataset.p,10);
    await B.setOffer(o.id,st,st==='accepted'?p:null);
    if(st==='accepted'&&o.trip&&o.trip.kind==='ride_offer'){const left=Math.max(0,(o.trip.seats_left!=null?o.trip.seats_left:o.trip.seats||1)-(o.seats||1));await B.updateTrip(o.trip_id,{seats_left:left,status:left===0?'full':'open'})}
    await B.send(o.id,{sender_name:S.profile.name,kind:'text',body:st==='accepted'?'✅ '+t('accepted'):'❌ '+t('declined')});toast(t('tDone'));await refresh()}
  else if(a==='star'){const n=+b.dataset.n;S.star=n;$$('#rStars button').forEach((x,i)=>{x.textContent=i<n?'★':'☆'})}
  else if(a==='rate'){if(!S.star){toast(t('eFill'),1);return}await B.rate(b.dataset.o,b.dataset.to,S.star,($('#rComment').value||'').trim().slice(0,200));S.star=0;await refresh();await renderChat()}
  else if(a==='propose'){const v=$('#cPrice').value;if(v==='')return;await B.send(S.chat,{sender_name:S.profile.name,kind:'price',price:parseInt(v,10),body:v});await renderChat()}
  }catch(err){console.warn(err);toast(t('tErr'),1)}
}
function setLang(l){
  LANG=T[l]?l:'ar';try{localStorage.setItem('enstp-lang',LANG)}catch(e){}
  const r=document.documentElement;r.dir=LANG==='ar'?'rtl':'ltr';r.lang=LANG;document.body.dataset.lang=LANG;
  ['ar','fr','en'].forEach(x=>$('#btn-'+x).classList.toggle('on',x===LANG));
  $$('[data-i]').forEach(el=>{const v=T[LANG][el.dataset.i];if(v!==undefined)el.innerHTML=v});
  $$('[data-ph]').forEach(el=>el.placeholder=T[LANG][el.dataset.ph]||'');
  document.title=T[LANG].title;
  renderSelects();renderTabs();renderDirs();setVis();renderStats();renderFeed();paintPost();
  if($('#mMine').classList.contains('open'))renderMine();if($('#mChat').classList.contains('open'))renderChat(false);
}
function toggleTheme(){const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;$('#metaTheme').content=n==='dark'?'#040b17':'#f3f6fc';try{localStorage.setItem('enstp-theme',n)}catch(e){}}

async function start(){
  B=DEMO?makeDemo():makeSupabase();
  let s='ar';try{s=localStorage.getItem('enstp-lang')||'ar'}catch(e){}
  LANG=T[s]?s:'ar';
  try{S.uid=await B.init()}catch(e){toast(t('eAuth'),1);S.uid=null}
  S.profile=S.uid?await B.getProfile().catch(()=>null):null;
  setLang(LANG);$('#metaTheme').content=document.documentElement.dataset.theme==='dark'?'#040b17':'#f3f6fc';
  $('#demoBox').classList.toggle('show',DEMO);
  $('#fq').oninput=e=>{S.q=e.target.value;renderFeed()};
  $('#fw').onchange=e=>{S.wil=e.target.value;renderFeed()};$('#fd').onchange=e=>{S.date=e.target.value;renderFeed()};$('#fs').onchange=e=>{S.sort=e.target.value;renderFeed()};
  $('#fProfile').addEventListener('submit',e=>{askNotif();saveProfile(e)});$('#fPost').addEventListener('submit',submitPost);$('#fOffer').addEventListener('submit',submitOffer);
  $('#mineBtn').onclick=()=>openMine('trips');
  $$('#mMine .mt button').forEach(b=>b.onclick=()=>{S.mineTab=b.dataset.t;renderMine()});
  $$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
  $$('.modal').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)m.classList.remove('open')}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.modal.open').forEach(m=>m.classList.remove('open'))});
  document.addEventListener('click',onAction);
  document.addEventListener('submit',async e=>{if(e.target.id==='cForm'){e.preventDefault();const v=$('#cIn').value.trim();if(!v)return;$('#cIn').value='';try{await B.send(S.chat,{sender_name:S.profile.name,kind:'text',body:v});await renderChat()}catch(err){toast(t('tErr'),1)}}});
  B.onChange(()=>refresh());
  await refresh();
  const q=new URLSearchParams(location.search).get('trip');if(q){const el=document.getElementById('t'+q);if(el){el.scrollIntoView({block:'center'});el.style.outline='3px solid var(--gold)'}}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  $$('.reveal').forEach(el=>io.observe(el));
  const pb=$('#progressBar'),tt=$('#toTop');
  addEventListener('scroll',()=>{const h=document.documentElement;pb.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%';tt.classList.toggle('show',h.scrollTop>600)},{passive:true});
}
(function(){let s='ar';try{s=localStorage.getItem('enstp-lang')||'ar'}catch(e){}LANG=T[s]?s:'ar'})();
window.addEventListener('DOMContentLoaded',()=>{if(DEMO||window.supabase)start();else{const iv=setInterval(()=>{if(window.supabase){clearInterval(iv);start()}},60)}});
</script>
</body>

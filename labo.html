<style>
/* ===== ENSTP — نظام التصميم الموحد (نفس الصفحة الرئيسية) ===== */
:root{
--bg:#f3f6fc;--ink:#1b2a47;--muted:#5a6b88;--head:#0b1d3a;
--gold:#f5b841;--gold-2:#ffdf9a;--cyan:#38bdf8;--violet:#8b7bff;
--glass-b:rgba(20,50,110,.13);--radius:26px;--ease:cubic-bezier(.22,1,.36,1);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#d6e6ff 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#e6eeff 0%,transparent 60%),#f3f6fc;
--au-op:.55;--grid:rgba(40,80,160,.08);
--bar:rgba(255,255,255,.72);--bar-s:rgba(255,255,255,.92);
--bar-shadow:0 14px 40px rgba(20,50,110,.14);--bar-inset:rgba(255,255,255,.9);
--logo-grad:linear-gradient(100deg,#0b1d3a,#b9770e);
--soft:rgba(20,50,110,.05);--soft-b:rgba(20,50,110,.1);--nav-c:#41547a;
--hero-o1:rgba(8,26,60,.5);--hero-o2:rgba(8,26,60,.82);
--card:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,255,255,.72));
--card-b:rgba(20,50,110,.11);--card-shadow:0 20px 50px rgba(20,50,110,.13);
--card-shadow-h:0 34px 70px rgba(20,50,110,.2),0 0 50px rgba(245,184,65,.18);
--desc:#53648a;--tag-c:#a8650a;--icon-ring:#fff;--img-fade:rgba(8,22,50,.55);
--btn-c:#1e3358;--toggle-bg:#0b1d3a;--toggle-c:#ffdf9a;
}
html.dark{
--bg:#040b17;--ink:#e8eef9;--muted:#8fa3c0;--head:#fff;--glass-b:rgba(255,255,255,.12);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#0d2a52 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#0a1d3d 0%,transparent 60%),#040b17;
--au-op:1;--grid:rgba(120,160,220,.07);
--bar:rgba(8,18,36,.55);--bar-s:rgba(5,12,26,.85);--bar-shadow:0 18px 50px rgba(0,0,0,.35);--bar-inset:rgba(255,255,255,.08);
--logo-grad:linear-gradient(100deg,#fff,#ffdf9a);
--soft:rgba(255,255,255,.05);--soft-b:rgba(255,255,255,.1);--nav-c:#b9c8df;
--hero-o1:rgba(4,11,23,.55);--hero-o2:rgba(4,11,23,.92);
--card:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
--card-b:rgba(255,255,255,.1);--card-shadow:0 22px 60px rgba(0,0,0,.35);
--card-shadow-h:0 36px 80px rgba(0,0,0,.5),0 0 60px rgba(245,184,65,.12);
--desc:#9db0cd;--tag-c:#ffdf9a;--icon-ring:#0a1730;--img-fade:rgba(4,11,23,.92);
--btn-c:#dbe7fb;--toggle-bg:#ffdf9a;--toggle-c:#14100a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body[data-lang="fr"],body[data-lang="en"]{font-family:'Inter','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#101828}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* خلفية حية */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--au-bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#1d5fd1;top:-120px;inset-inline-start:-80px;opacity:calc(.38*var(--au-op))}
.aurora i:nth-child(2){width:460px;height:460px;background:#7c4dff;top:45%;inset-inline-end:-120px;animation-duration:28s;opacity:calc(.28*var(--au-op))}
.aurora i:nth-child(3){width:420px;height:420px;background:#f5b841;bottom:-160px;inset-inline-start:30%;animation-duration:32s;opacity:calc(.16*var(--au-op))}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:200}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--violet));box-shadow:0 0 18px var(--gold)}

/* الشريط العلوي */
header{position:fixed;top:14px;inset-inline:0;z-index:150;padding:0 14px}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 14px;border-radius:22px;background:var(--bar);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--bar-shadow),inset 0 1px 0 var(--bar-inset)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{background:#fff;border-radius:14px;padding:5px 9px;box-shadow:0 6px 20px rgba(0,0,0,.3);flex-shrink:0}
.logo-img img{height:38px;width:auto;object-fit:contain}
#txt-brand{font-weight:900;font-size:1.05rem;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;font-size:.78rem;font-weight:800;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);white-space:nowrap;transition:.3s}
.back:hover{color:#111;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px rgba(245,184,65,.35)}
[dir="rtl"] .back i{transform:scaleX(-1)}
.lang{display:flex;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--soft-b)}
.lang button{font:inherit;font-size:.74rem;font-weight:800;padding:7px 11px;border-radius:10px;border:0;cursor:pointer;color:var(--nav-c);background:transparent;transition:.3s}
.lang button.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111;box-shadow:0 4px 14px rgba(245,184,65,.4)}
.theme-btn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--soft-b);cursor:pointer;overflow:hidden;background:var(--toggle-bg);color:var(--toggle-c);display:grid;place-items:center;flex-shrink:0;transition:transform .35s var(--ease)}
.theme-btn:hover{transform:translateY(-2px) rotate(-8deg)}
.theme-btn i{position:absolute;transition:transform .6s var(--ease),opacity .4s}
.theme-btn .i-sun{transform:translateY(130%) rotate(-90deg);opacity:0}
html.dark .theme-btn .i-moon{transform:translateY(-130%) rotate(90deg);opacity:0}
html.dark .theme-btn .i-sun{transform:none;opacity:1}

/* الواجهة */
.hero{position:relative;min-height:62svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate;padding:150px 20px 90px}
.hero-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,var(--hero-o1),var(--hero-o2)),url('photo16.jpg') center/cover no-repeat,linear-gradient(135deg,#0b2545,#1d5288)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 72%,var(--bg) 100%)}
.hero-inner{max-width:900px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:800;color:var(--gold-2);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(245,184,65,.4);backdrop-filter:blur(14px);margin-bottom:24px}
.hero h1{font-weight:900;font-size:clamp(1.9rem,5vw,3.6rem);line-height:1.35;color:#fff;text-wrap:balance;margin-bottom:22px;text-shadow:0 10px 50px rgba(0,0,0,.6)}
.hero h1 span{display:block;background:linear-gradient(100deg,#fff 0%,var(--gold-2) 40%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9d6ea;font-size:clamp(.95rem,1.5vw,1.08rem);line-height:2.05;max-width:760px;margin:0 auto}

main{max-width:1280px;margin:0 auto;padding:40px 20px 40px;display:flex;flex-direction:column;gap:90px}
.sec-head{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.sec-icon{flex-shrink:0;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:1.5rem;color:#fff;position:relative;background:linear-gradient(145deg,var(--c1,#2563eb),var(--c2,#38bdf8));box-shadow:0 14px 40px var(--c3,rgba(37,99,235,.45)),inset 0 1px 0 rgba(255,255,255,.4)}
.sec-icon::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:1px solid var(--c1,#2563eb);opacity:.35}
.sec-head h2{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:900;line-height:1.4;color:var(--head)}
.sec-head p{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:640px}
.sec-line{height:3px;width:90px;margin-top:12px;border-radius:3px;background:linear-gradient(270deg,var(--gold),transparent)}
[dir="ltr"] .sec-line{background:linear-gradient(90deg,var(--gold),transparent)}
.s-a{--c1:#2563eb;--c2:#38bdf8;--c3:rgba(37,99,235,.5)}
.s-b{--c1:#6d5cff;--c2:#b093ff;--c3:rgba(109,92,255,.5)}
.s-c{--c1:#059669;--c2:#34d399;--c3:rgba(5,150,105,.5)}
.s-d{--c1:#d97706;--c2:#fbbf24;--c3:rgba(217,119,6,.5)}

/* البطاقات */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
@media(max-width:992px){.two{grid-template-columns:1fr}}
.box{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);padding:32px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow)}
.box h3.t{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:900;color:var(--head);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--card-b)}
.box h3.t i{color:var(--gold)}
.box p{color:var(--desc);font-size:.92rem;line-height:2;margin-bottom:14px}
.director{display:flex;gap:22px;align-items:center;background:var(--soft);border:1px solid var(--card-b);padding:22px;border-radius:20px;margin-top:10px}
.director img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 25px rgba(245,184,65,.4);flex-shrink:0}
.director h4{font-size:1.1rem;font-weight:900;color:var(--head);margin-bottom:4px}
.director small{display:block;font-size:.78rem;color:var(--tag-c);font-weight:800;margin-bottom:6px}
.director p{font-size:.82rem;line-height:1.8;margin:0}
@media(max-width:600px){.director{flex-direction:column;text-align:center}}

.search-card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.search-card:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.card-image-wrap{position:relative;height:220px;overflow:hidden;background:linear-gradient(135deg,#0b2545,#1d5288)}
.card-image{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s;filter:saturate(1.05) brightness(.95)}
.search-card:hover .card-image{transform:scale(1.1);filter:saturate(1.25) brightness(1.05)}
.card-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--img-fade) 100%)}
.card-content{padding:18px 20px 20px}
.card-title{font-size:.98rem;font-weight:800;line-height:1.7;color:var(--head);text-align:center}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:auto;padding:15px 18px;border-radius:16px;font-weight:900;font-size:.9rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 14px 36px rgba(245,184,65,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s var(--ease),box-shadow .35s}
.btn:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(245,184,65,.55)}

footer{position:relative;margin-top:50px;padding:70px 20px 46px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#12386a 0%,transparent 65%),#030812}
footer::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 30px var(--gold)}
.f-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:1.6rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 14px 40px rgba(245,184,65,.4)}
#footer-title{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:6px}
#footer-sub{font-size:.85rem;color:#8fa3c0;max-width:520px;margin:0 auto}
.to-top{position:fixed;bottom:22px;inset-inline-end:18px;z-index:140;width:48px;height:48px;border-radius:16px;border:1px solid var(--glass-b);cursor:pointer;color:var(--tag-c);background:var(--bar-s);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(20px);transition:.4s var(--ease)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top:hover{background:var(--gold);color:#111}

.reveal{opacity:0;translate:0 40px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.reveal.in{opacity:1;translate:0 0}

@media(max-width:640px){
header{top:8px;padding:0 8px}
.bar{padding:7px 9px;border-radius:18px;gap:8px}
.logo-img img{height:30px}
#txt-brand{display:none}
.back span{display:none}
.lang button{padding:6px 8px;font-size:.68rem}
.hero{padding:120px 18px 70px}
main{gap:70px}
.card-image-wrap{height:190px}
.box{padding:24px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;translate:0 0}}

/* ===== طبقة مشتركة للصفحات المبنية على Tailwind ===== */
:root{--solid:#fff}
html.dark{--solid:#0a1730;color-scheme:dark}
html:not(.dark){color-scheme:light}
body{font-family:'Cairo',sans-serif}
html[lang="fr"] body,html[lang="en"] body{font-family:'Inter','Cairo',sans-serif}
.hero{min-height:40svh;padding:140px 20px 76px}
.hero-bg{background:linear-gradient(180deg,var(--hero-o1),var(--hero-o2)),url('photo30.jpg') center/cover no-repeat,linear-gradient(135deg,#0b2545,#1d5288)}
.hero h1 .grad{display:inline;background:linear-gradient(100deg,#fff 0%,var(--gold-2) 40%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding-top:50px;gap:28px}
.hidden{display:none!important}
#footer-text{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:6px}
.brand-t{font-weight:900;font-size:1.05rem;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ibtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--soft-b);background:var(--soft);color:var(--nav-c);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.3s}
.ibtn:hover{color:#111;background:linear-gradient(135deg,var(--gold-2),var(--gold))}
.pill-clock{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;font-size:.78rem;font-weight:800;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill-clock i{color:var(--gold)}
/* بطاقات */
.box,.glass-panel,.glass-card{position:relative;border-radius:var(--radius)!important;background:var(--card)!important;border:1px solid var(--card-b)!important;box-shadow:var(--card-shadow)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.box{padding:28px}
@media(max-width:640px){.box{padding:20px}}
/* أزرار */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border-radius:15px;font:inherit;font-weight:800;font-size:.82rem;cursor:pointer;color:var(--btn-c);background:var(--soft);border:1px solid var(--glass-b);transition:.3s var(--ease)}
.gbtn:hover{color:#14100a;border-color:var(--gold);background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 10px 30px rgba(245,184,65,.35)}
.gbtn.main{color:#14100a;border-color:transparent;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 12px 30px rgba(245,184,65,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.gbtn.main:hover{transform:translateY(-3px);box-shadow:0 20px 46px rgba(245,184,65,.55)}
/* حقول الإدخال */
main select,main input[type=text],main input[type=search],#task-modal input:not([type=hidden]),#task-modal select,#task-modal textarea{background:var(--bar-s)!important;border:1px solid var(--glass-b)!important;color:var(--head)!important;border-radius:16px!important;font-weight:600;outline:0}
main select:focus,main input:focus,#task-modal input:focus,#task-modal select:focus,#task-modal textarea:focus{border-color:var(--gold)!important;box-shadow:0 0 0 4px rgba(245,184,65,.22)!important}
main select option,#task-modal select option{color:#111;background:#fff}
::placeholder{color:var(--muted)!important;font-weight:500}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--soft)}::-webkit-scrollbar-thumb{background:rgba(120,140,180,.5);border-radius:6px}
/* موبايل */
@media(max-width:640px){
header{top:8px;padding:0 8px}
.bar{padding:7px 9px;border-radius:18px;gap:8px}
.logo-img img{height:30px}
.brand-t,#txt-brand{display:none}
.back span{display:none}
.lang button{padding:6px 8px;font-size:.68rem}
.pill-clock{display:none}
.hero{padding:112px 18px 64px;min-height:34svh}
main{padding:34px 14px 30px}}
@media print{.aurora,.grid-bg,.progress,header,.hero,.to-top,footer{display:none!important}body{background:#fff!important;color:#000!important}main{padding:0}}

/* ===== خاص بصفحة المخابر ===== */
.stat{padding:18px 12px;text-align:center;border-radius:22px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow);backdrop-filter:blur(14px)}
.stat b{display:block;font-size:1.7rem;font-weight:900;background:linear-gradient(135deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
.stat span{font-size:.78rem;font-weight:700;color:var(--muted)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--card-b)}
.sec-t{font-size:1.35rem;font-weight:900;color:var(--head);display:flex;align-items:center;gap:10px}
.sec-t i{color:var(--gold)}
.sec-head p{font-size:.8rem;color:var(--muted);margin-top:4px;font-weight:600}
.count{font-size:.75rem;font-weight:800;color:var(--tag-c,var(--muted));background:var(--soft);border:1px solid var(--soft-b);padding:7px 14px;border-radius:12px;white-space:nowrap}
.lab-card{position:relative;border-radius:var(--radius);background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow);backdrop-filter:blur(14px);transition:transform .4s var(--ease),box-shadow .4s}
.lab-card:hover{transform:translateY(-6px);box-shadow:var(--card-shadow-h)}
.lab-card p.text-slate-600{color:var(--muted)!important;font-weight:600}

        // Initialize App UI
        document.addEventListener('DOMContentLoaded', () => {
            renderLabs(labsData);
        });

        // Render Lab Cards Grid
        function renderLabs(data) {
            const grid = document.getElementById('labsGrid');
            const noResults = document.getElementById('noResults');
            const visibleCount = document.getElementById('visibleLabsCount');
            
            grid.innerHTML = '';
            visibleCount.innerText = data.length;

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(lab => {
                const title = currentLang === 'ar' ? lab.titleAr : lab.titleFr;
                const shortDesc = currentLang === 'ar' ? lab.shortDescAr : lab.shortDescFr;
                const btnText = LT('استعراض الأدوات والتفاصيل', 'Voir Équipements & Détails', 'View equipment & details');

                const cardHtml = `
                    <div class="lab-card overflow-hidden flex flex-col group">
                        <!-- Lab Image Header -->
                        <div class="relative h-48 overflow-hidden bg-slate-800">
                            <img src="${lab.mainImage}" alt="${title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 opacity-90 group-hover:opacity-100">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"></div>
                            
                            <!-- Badges -->
                            <div class="absolute top-3 right-3 bg-enstp-navy/90 backdrop-blur-md text-amber-400 font-extrabold text-xs px-3 py-1.5 rounded-lg shadow-md border border-amber-500/30 flex items-center gap-1.5">
                                <i class="fa-solid ${lab.icon}"></i>
                                <span>${lab.code}</span>
                            </div>
                            
                            <div class="absolute bottom-3 right-3 left-3">
                                <h3 class="text-lg font-bold text-white leading-snug drop-shadow">${title}</h3>
                                <p class="text-xs text-amber-300 font-medium">${lab.titleFr}</p>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="p-5 flex-grow flex flex-col justify-between space-y-4">
                            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${shortDesc}</p>
                            
                            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                                <span class="text-xs font-semibold text-slate-500 flex items-center gap-1">
                                    <i class="fa-solid fa-microscope text-enstp-lightBlue"></i>
                                    ${lab.equipment.length} ${LT('أجهزة رئيسية', 'équipements', 'main devices')}
                                </span>
                                
                                <button onclick="openModal('${lab.id}')" class="gbtn main sm" style="min-height:38px;padding:0 14px;font-size:.74rem">
                                    <span>${btnText}</span>
                                    <i class="fa-solid ${currentLang === 'ar' ? 'fa-arrow-left' : 'fa-arrow-right'} text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Open Detail Modal
        function openModal(labId) {
            currentLabId = labId;
            const lab = labsData.find(l => l.id === labId);
            if (!lab) return;

            // Set Header & Icon
            document.getElementById('modalTitleAr').innerText = lab.titleAr;
            document.getElementById('modalTitleFr').innerText = lab.titleFr;
            
            const iconContainer = document.getElementById('modalIconContainer');
            iconContainer.innerHTML = `<i class="fa-solid ${lab.icon}"></i>`;

            // Set Main Image & Description
            document.getElementById('modalMainImg').src = lab.mainImage;
            document.getElementById('modalLabDesc').innerText = currentLang === 'ar' ? lab.shortDescAr : lab.shortDescFr;
            document.getElementById('modalFullDesc').innerText = currentLang === 'ar' ? lab.fullDescAr : lab.fullDescFr;

            // Render Equipment Grid inside Modal
            renderModalEquipment(lab.equipment);

            // Show Modal
            document.getElementById('labModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Render Modal Equipment Cards
        function renderModalEquipment(equipmentList) {
            const grid = document.getElementById('equipmentGrid');
            grid.innerHTML = '';

            equipmentList.forEach((item, index) => {
                const name = currentLang === 'ar' ? item.nameAr : item.nameFr;
                const desc = currentLang === 'ar' ? item.descAr : item.descFr;

                const equipHtml = `
                    <div class="eq-card overflow-hidden flex flex-col group">
                        <div class="relative h-36 bg-slate-100 overflow-hidden cursor-pointer" onclick="openLightbox('${item.image}', '${name}')">
                            <img src="${item.image}" alt="${name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xl">
                                <i class="fa-solid fa-magnifying-glass-plus"></i>
                            </div>
                        </div>
                        <div class="p-3 flex-grow flex flex-col justify-between">
                            <div>
                                <h5 class="text-xs sm:text-sm font-bold text-slate-800 leading-tight mb-1">${name}</h5>
                                <p class="text-xs text-slate-500 leading-snug">${desc}</p>
                            </div>
                            <div class="mt-2 text-left">
                                <button onclick="openLightbox('${item.image}', '${name}')" class="text-[11px] text-enstp-lightBlue font-semibold hover:underline">
                                    <i class="fa-regular fa-image me-1"></i> ${LT('تكبير الصورة', 'Agrandir', 'Enlarge')}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', equipHtml);
            });
        }

        // Close Modal
        function closeModal() {
            document.getElementById('labModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Lightbox Functions
        function openLightbox(imgSrc, caption) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightboxCaption').innerText = caption;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        // Local Image Preview Upload for Main Lab Image
        function uploadMainLabImage(event) {
            const file = event.target.files[0];
            if (file && currentLabId) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newUrl = e.target.result;
                    // Update current lab in memory
                    const lab = labsData.find(l => l.id === currentLabId);
                    if (lab) {
                        lab.mainImage = newUrl;
                        document.getElementById('modalMainImg').src = newUrl;
                        renderLabs(labsData); // Refresh grid
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // Local Image Preview Upload for Adding Equipment
        function uploadEquipmentImage(event) {
            const file = event.target.files[0];
            if (file && currentLabId) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newUrl = e.target.result;
                    const lab = labsData.find(l => l.id === currentLabId);
                    if (lab) {
                        lab.equipment.unshift({
                            nameAr: 'أداة جديدة تمت إضافتها',
                            nameFr: 'Nouvel Équipement Ajouté',
                            descAr: 'معاينة الصورة المرفوعة من الجهاز المحلي.',
                            descFr: 'Aperçu de l\'image téléchargée localement.',
                            image: newUrl
                        });
                        renderModalEquipment(lab.equipment);
                        renderLabs(labsData); // Refresh background
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // Search & Filter Logic
        function filterLabs() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const catVal = document.getElementById('categoryFilter').value;

            const filtered = labsData.filter(lab => {
                // Category match
                const matchCategory = catVal === 'all' || lab.category === catVal;

                // Search query match (in name, french name, or equipment)
                const matchSearch = 
                    lab.titleAr.toLowerCase().includes(searchVal) ||
                    lab.titleFr.toLowerCase().includes(searchVal) ||
                    lab.code.toLowerCase().includes(searchVal) ||
                    lab.shortDescAr.toLowerCase().includes(searchVal) ||
                    lab.equipment.some(e => e.nameAr.toLowerCase().includes(searchVal) || e.nameFr.toLowerCase().includes(searchVal));

                return matchCategory && matchSearch;
            });

            renderLabs(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = 'all';
            renderLabs(labsData);
        }

        // Language handler (AR / FR / EN) - driven by the shared header buttons
        const PH = {
            ar: 'ابحث عن مخبر أو أداة أو تجربة...',
            fr: 'Rechercher un labo, un équipement, un essai...',
            en: 'Search a lab, equipment or experiment...'
        };
        function setLang(l) {
            currentLang = (l === 'fr' || l === 'en') ? l : 'ar';
            const htmlTag = document.documentElement;
            htmlTag.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            htmlTag.setAttribute('lang', currentLang);
            document.getElementById('searchInput').placeholder = PH[currentLang];
            filterLabs();
            if (currentLabId && !document.getElementById('labModal').classList.contains('hidden')) {
                openModal(currentLabId);
            }
        }
        (function () {
            const sel = document.getElementById('languageSelect');
            sel.addEventListener('change', () => setLang(sel.value));
            setLang(currentLang);
        })();

        // Theme toggle (shared key with the rest of the site)
        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light', !isDark);
            try { localStorage.setItem('enstp-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        });
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3f6fc" id="metaTheme">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("enstp-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>لوحة فريق الدراسة - ENSTP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== ENSTP — نظام التصميم الموحد (نفس الصفحة الرئيسية) ===== */
:root{
--bg:#f3f6fc;--ink:#1b2a47;--muted:#5a6b88;--head:#0b1d3a;
--gold:#f5b841;--gold-2:#ffdf9a;--cyan:#38bdf8;--violet:#8b7bff;
--glass-b:rgba(20,50,110,.13);--radius:26px;--ease:cubic-bezier(.22,1,.36,1);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#d6e6ff 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#e6eeff 0%,transparent 60%),#f3f6fc;
--au-op:.55;--grid:rgba(40,80,160,.08);
--bar:rgba(255,255,255,.72);--bar-s:rgba(255,255,255,.92);
--bar-shadow:0 14px 40px rgba(20,50,110,.14);--bar-inset:rgba(255,255,255,.9);
--logo-grad:linear-gradient(100deg,#0b1d3a,#b9770e);
--soft:rgba(20,50,110,.05);--soft-b:rgba(20,50,110,.1);--nav-c:#41547a;
--hero-o1:rgba(8,26,60,.5);--hero-o2:rgba(8,26,60,.82);
--card:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,255,255,.72));
--card-b:rgba(20,50,110,.11);--card-shadow:0 20px 50px rgba(20,50,110,.13);
--card-shadow-h:0 34px 70px rgba(20,50,110,.2),0 0 50px rgba(245,184,65,.18);
--desc:#53648a;--tag-c:#a8650a;--icon-ring:#fff;--img-fade:rgba(8,22,50,.55);
--btn-c:#1e3358;--toggle-bg:#0b1d3a;--toggle-c:#ffdf9a;
}
html[data-theme="dark"]{
--bg:#040b17;--ink:#e8eef9;--muted:#8fa3c0;--head:#fff;--glass-b:rgba(255,255,255,.12);
--au-bg:radial-gradient(1200px 700px at 85% -10%,#0d2a52 0%,transparent 60%),radial-gradient(900px 600px at 0% 40%,#0a1d3d 0%,transparent 60%),#040b17;
--au-op:1;--grid:rgba(120,160,220,.07);
--bar:rgba(8,18,36,.55);--bar-s:rgba(5,12,26,.85);--bar-shadow:0 18px 50px rgba(0,0,0,.35);--bar-inset:rgba(255,255,255,.08);
--logo-grad:linear-gradient(100deg,#fff,#ffdf9a);
--soft:rgba(255,255,255,.05);--soft-b:rgba(255,255,255,.1);--nav-c:#b9c8df;
--hero-o1:rgba(4,11,23,.55);--hero-o2:rgba(4,11,23,.92);
--card:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
--card-b:rgba(255,255,255,.1);--card-shadow:0 22px 60px rgba(0,0,0,.35);
--card-shadow-h:0 36px 80px rgba(0,0,0,.5),0 0 60px rgba(245,184,65,.12);
--desc:#9db0cd;--tag-c:#ffdf9a;--icon-ring:#0a1730;--img-fade:rgba(4,11,23,.92);
--btn-c:#dbe7fb;--toggle-bg:#ffdf9a;--toggle-c:#14100a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body[data-lang="fr"],body[data-lang="en"]{font-family:'Inter','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#101828}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* خلفية حية */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--au-bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#1d5fd1;top:-120px;inset-inline-start:-80px;opacity:calc(.38*var(--au-op))}
.aurora i:nth-child(2){width:460px;height:460px;background:#7c4dff;top:45%;inset-inline-end:-120px;animation-duration:28s;opacity:calc(.28*var(--au-op))}
.aurora i:nth-child(3){width:420px;height:420px;background:#f5b841;bottom:-160px;inset-inline-start:30%;animation-duration:32s;opacity:calc(.16*var(--au-op))}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:200}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--violet));box-shadow:0 0 18px var(--gold)}

/* الشريط العلوي */
header{position:fixed;top:14px;inset-inline:0;z-index:150;padding:0 14px}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 14px;border-radius:22px;background:var(--bar);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--bar-shadow),inset 0 1px 0 var(--bar-inset)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{background:#fff;border-radius:14px;padding:5px 9px;box-shadow:0 6px 20px rgba(0,0,0,.3);flex-shrink:0}
.logo-img img{height:38px;width:auto;object-fit:contain}
#txt-brand{font-weight:900;font-size:1.05rem;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:13px;font-size:.78rem;font-weight:800;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);white-space:nowrap;transition:.3s}
.back:hover{color:#111;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px rgba(245,184,65,.35)}
[dir="rtl"] .back i{transform:scaleX(-1)}
.lang{display:flex;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--soft-b)}
.lang button{font:inherit;font-size:.74rem;font-weight:800;padding:7px 11px;border-radius:10px;border:0;cursor:pointer;color:var(--nav-c);background:transparent;transition:.3s}
.lang button.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111;box-shadow:0 4px 14px rgba(245,184,65,.4)}
.theme-btn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--soft-b);cursor:pointer;overflow:hidden;background:var(--toggle-bg);color:var(--toggle-c);display:grid;place-items:center;flex-shrink:0;transition:transform .35s var(--ease)}
.theme-btn:hover{transform:translateY(-2px) rotate(-8deg)}
.theme-btn i{position:absolute;transition:transform .6s var(--ease),opacity .4s}
.theme-btn .i-sun{transform:translateY(130%) rotate(-90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-moon{transform:translateY(-130%) rotate(90deg);opacity:0}
html[data-theme="dark"] .theme-btn .i-sun{transform:none;opacity:1}

/* الواجهة */
.hero{position:relative;min-height:62svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate;padding:150px 20px 90px}
.hero-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,var(--hero-o1),var(--hero-o2)),url('photo11.jpg') center/cover no-repeat,linear-gradient(135deg,#0b2545,#1d5288)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 72%,var(--bg) 100%)}
.hero-inner{max-width:900px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:800;color:var(--gold-2);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(245,184,65,.4);backdrop-filter:blur(14px);margin-bottom:24px}
.hero h1{font-weight:900;font-size:clamp(1.9rem,5vw,3.6rem);line-height:1.35;color:#fff;text-wrap:balance;margin-bottom:22px;text-shadow:0 10px 50px rgba(0,0,0,.6)}
.hero h1 span{display:block;background:linear-gradient(100deg,#fff 0%,var(--gold-2) 40%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9d6ea;font-size:clamp(.95rem,1.5vw,1.08rem);line-height:2.05;max-width:760px;margin:0 auto}

main{max-width:1280px;margin:0 auto;padding:40px 20px 40px;display:flex;flex-direction:column;gap:90px}
.sec-head{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.sec-icon{flex-shrink:0;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:1.5rem;color:#fff;position:relative;background:linear-gradient(145deg,var(--c1,#2563eb),var(--c2,#38bdf8));box-shadow:0 14px 40px var(--c3,rgba(37,99,235,.45)),inset 0 1px 0 rgba(255,255,255,.4)}
.sec-icon::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:1px solid var(--c1,#2563eb);opacity:.35}
.sec-head h2{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:900;line-height:1.4;color:var(--head)}
.sec-head p{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:640px}
.sec-line{height:3px;width:90px;margin-top:12px;border-radius:3px;background:linear-gradient(270deg,var(--gold),transparent)}
[dir="ltr"] .sec-line{background:linear-gradient(90deg,var(--gold),transparent)}
.s-a{--c1:#2563eb;--c2:#38bdf8;--c3:rgba(37,99,235,.5)}
.s-b{--c1:#6d5cff;--c2:#b093ff;--c3:rgba(109,92,255,.5)}
.s-c{--c1:#059669;--c2:#34d399;--c3:rgba(5,150,105,.5)}
.s-d{--c1:#d97706;--c2:#fbbf24;--c3:rgba(217,119,6,.5)}

/* البطاقات */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
@media(max-width:992px){.two{grid-template-columns:1fr}}
.box{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);padding:32px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow)}
.box h3.t{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:900;color:var(--head);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--card-b)}
.box h3.t i{color:var(--gold)}
.box p{color:var(--desc);font-size:.92rem;line-height:2;margin-bottom:14px}
.director{display:flex;gap:22px;align-items:center;background:var(--soft);border:1px solid var(--card-b);padding:22px;border-radius:20px;margin-top:10px}
.director img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 25px rgba(245,184,65,.4);flex-shrink:0}
.director h4{font-size:1.1rem;font-weight:900;color:var(--head);margin-bottom:4px}
.director small{display:block;font-size:.78rem;color:var(--tag-c);font-weight:800;margin-bottom:6px}
.director p{font-size:.82rem;line-height:1.8;margin:0}
@media(max-width:600px){.director{flex-direction:column;text-align:center}}

.search-card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--card-shadow);transition:transform .4s var(--ease),box-shadow .4s}
.search-card:hover{transform:translateY(-8px);box-shadow:var(--card-shadow-h)}
.card-image-wrap{position:relative;height:220px;overflow:hidden;background:linear-gradient(135deg,#0b2545,#1d5288)}
.card-image{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s;filter:saturate(1.05) brightness(.95)}
.search-card:hover .card-image{transform:scale(1.1);filter:saturate(1.25) brightness(1.05)}
.card-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--img-fade) 100%)}
.card-content{padding:18px 20px 20px}
.card-title{font-size:.98rem;font-weight:800;line-height:1.7;color:var(--head);text-align:center}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:auto;padding:15px 18px;border-radius:16px;font-weight:900;font-size:.9rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#e29a14);box-shadow:0 14px 36px rgba(245,184,65,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s var(--ease),box-shadow .35s}
.btn:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(245,184,65,.55)}

footer{position:relative;margin-top:50px;padding:70px 20px 46px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#12386a 0%,transparent 65%),#030812}
footer::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 30px var(--gold)}
.f-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:1.6rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 14px 40px rgba(245,184,65,.4)}
#footer-title{font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:6px}
#footer-sub{font-size:.85rem;color:#8fa3c0;max-width:520px;margin:0 auto}
.to-top{position:fixed;bottom:22px;inset-inline-end:18px;z-index:140;width:48px;height:48px;border-radius:16px;border:1px solid var(--glass-b);cursor:pointer;color:var(--tag-c);background:var(--bar-s);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(20px);transition:.4s var(--ease)}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top:hover{background:var(--gold);color:#111}

.reveal{opacity:0;translate:0 40px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.reveal.in{opacity:1;translate:0 0}

@media(max-width:640px){
header{top:8px;padding:0 8px}
.bar{padding:7px 9px;border-radius:18px;gap:8px}
.logo-img img{height:30px}
#txt-brand{display:none}
.back span{display:none}
.lang button{padding:6px 8px;font-size:.68rem}
.hero{padding:120px 18px 70px}
main{gap:70px}
.card-image-wrap{height:190px}
.box{padding:24px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.reveal{opacity:1;translate:0 0}}

.hidden{display:none!important}
main{padding-top:130px;gap:26px;min-height:70svh}
.login{max-width:440px;margin:0 auto;width:100%;padding:34px;border-radius:30px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);box-shadow:var(--card-shadow)}
.login .ico{width:60px;height:60px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;font-size:1.5rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 14px 34px rgba(245,184,65,.45)}
.login h1{font-size:1.4rem;font-weight:900;color:var(--head);text-align:center}
.login>p{font-size:.84rem;color:var(--muted);text-align:center;margin:6px 0 22px;line-height:1.9}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.76rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:13px 15px;border-radius:14px;font:inherit;font-size:.9rem;color:var(--ink);background:var(--bar-s);border:1px solid var(--card-b);outline:0;transition:.25s}
.fld textarea{resize:vertical;min-height:80px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,65,.22)}
.msg{padding:12px 14px;border-radius:14px;font-size:.82rem;font-weight:700;line-height:1.8;margin-bottom:14px;color:#7f1d1d;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.35)}
html[data-theme="dark"] .msg{color:#fecaca}
.btn.b{border:0;cursor:pointer;font-family:inherit;margin:0}
.bar2{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-radius:24px;color:#fff;background:radial-gradient(ellipse at 0% 0%,#1d5fd1 0%,transparent 60%),linear-gradient(160deg,#0b2545,#030812);box-shadow:var(--card-shadow)}
.who{display:flex;align-items:center;gap:14px}
.who .av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:1.2rem;color:#14100a;background:linear-gradient(135deg,var(--gold-2),var(--gold))}
.who h2{font-size:1.05rem;font-weight:900}
.who small{font-size:.76rem;font-weight:700;color:var(--gold-2)}
.tb{display:flex;flex-wrap:wrap;gap:8px}
.ib{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.78rem;font-weight:800;padding:10px 14px;border-radius:13px;cursor:pointer;color:#e8eef9;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);transition:.3s}
.ib:hover{background:var(--gold);color:#111;border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{cursor:pointer;text-align:start;padding:16px 18px;border-radius:20px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--card-b);box-shadow:var(--card-shadow);transition:transform .3s var(--ease),border-color .3s}
.st:hover{transform:translateY(-4px)}
.st.on{border-color:var(--gold);box-shadow:var(--card-shadow-h)}
.st b{display:block;font-family:'Inter',sans-serif;font-size:1.9rem;font-weight:900;color:var(--head);line-height:1.1}
.st span{font-size:.78rem;font-weight:800;color:var(--muted)}
.st i{float:inline-end;font-size:1.1rem;margin-top:4px}
.flt{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sbx{flex:1 1 280px;display:flex;align-items:center;border-radius:16px;background:var(--bar-s);border:1px solid var(--card-b)}
.sbx i{padding-inline:16px;color:var(--muted)}
.sbx input{flex:1;min-width:0;padding:13px 4px;background:transparent;border:0;outline:0;font:inherit;font-size:.9rem;color:var(--head)}
.sbx:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,65,.22)}
.dch{display:flex;gap:8px;flex-wrap:wrap}
.dch button{font:inherit;font-size:.78rem;font-weight:800;padding:10px 15px;border-radius:13px;cursor:pointer;color:var(--nav-c);background:var(--soft);border:1px solid var(--soft-b);transition:.3s}
.dch button.on{color:#14100a;border-color:transparent;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 16px rgba(245,184,65,.4)}
.upd{font-size:.74rem;color:var(--muted);font-weight:700}
.list{display:grid;gap:12px}
.rq{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;width:100%;text-align:start;padding:16px 20px;border-radius:20px;cursor:pointer;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--card-b);box-shadow:var(--card-shadow);transition:transform .3s var(--ease),border-color .3s}
@media(max-width:640px){.rq{grid-template-columns:1fr;gap:8px}}
.rq:hover{transform:translateY(-3px);border-color:var(--gold)}
.rq.nw{border-inline-start:5px solid var(--gold)}
.rq .cd{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:900;padding:8px 12px;border-radius:12px;color:var(--tag-c);background:rgba(245,184,65,.14);white-space:nowrap}
.rq h3{font-size:.98rem;font-weight:900;color:var(--head);line-height:1.5}
.rq .mt{font-size:.78rem;color:var(--desc);font-weight:600;line-height:1.8}
.rq .mt b{color:var(--muted);font-weight:800}
.pill{font-size:.74rem;font-weight:800;padding:6px 13px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag{font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:8px;color:#fff;background:#2563eb;margin-inline-start:6px}
.tag.cp{background:#2563eb}.tag.dib{background:#059669}.tag.dms{background:#7c3aed}
.empty{text-align:center;padding:50px 20px;border-radius:24px;color:var(--muted);font-weight:800;background:var(--card);border:1px solid var(--card-b)}
.empty i{display:block;font-size:2rem;color:var(--gold);margin-bottom:10px}
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,8,18,.7);backdrop-filter:blur(8px)}
.modal.open{display:flex}
.mbox{position:relative;width:100%;max-width:620px;max-height:92svh;overflow:auto;padding:26px;border-radius:28px;background:var(--bar-s);border:1px solid var(--glass-b);box-shadow:0 40px 100px rgba(0,0,0,.5);animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
.mx{position:absolute;top:16px;inset-inline-start:16px;width:38px;height:38px;border-radius:12px;border:1px solid var(--soft-b);background:var(--soft);color:var(--nav-c);cursor:pointer}
.mx:hover{background:var(--gold);color:#111}
.mbox h3{font-size:1.2rem;font-weight:900;color:var(--head);margin:26px 0 4px}
.mbox .sub{font-size:.8rem;font-weight:800;color:var(--tag-c)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.grid div{padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--card-b)}
.grid small{display:block;font-size:.7rem;font-weight:800;color:var(--muted);margin-bottom:2px}
.grid span{font-size:.86rem;font-weight:700;color:var(--ink);word-break:break-word}
.grid .w{grid-column:1/-1}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.contact a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-size:.8rem;font-weight:800;color:var(--btn-c);background:var(--soft);border:1px solid var(--card-b);transition:.3s}
.contact a:hover{background:var(--gold);color:#111;border-color:transparent}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:400;max-width:90vw;padding:12px 22px;border-radius:14px;font-size:.84rem;font-weight:800;color:#14100a;background:var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.35s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%)}
.hint{font-size:.74rem;color:var(--muted);line-height:1.9;text-align:center;margin-top:14px}
</style>
</head>
<body data-lang="ar">
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grid-bg"></div>
<div class="progress"><b id="progressBar"></b></div>
<header>
<div class="bar">
<div class="logo"><div class="logo-img"><img src="https://enstp.edu.dz/themes/custom/corporate3/logo.png" alt="ENSTP"></div><span id="txt-brand">لوحة فريق الدراسة</span></div>
<div class="tools">
<button class="back hidden" id="logoutTop" onclick="logout()" style="cursor:pointer;font-family:inherit"><i class="fa-solid fa-right-from-bracket" style="transform:none"></i><span>خروج</span></button>
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Dark mode"><i class="fa-solid fa-moon i-moon"></i><i class="fa-solid fa-sun i-sun"></i></button>
</div>
</div>
</header>
<main>
<section id="loginBox" class="login">
<div class="ico"><i class="fa-solid fa-user-shield"></i></div>
<h1>دخول فريق الدراسة</h1>
<p>خاص بموظفي مصلحة الدراسة. يرى كل فريق طلبات قسمه فقط.</p>
<div id="loginErr" class="msg hidden"></div>
<form onsubmit="doLogin(event)">
<div class="fld"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username" dir="ltr"></div>
<div class="fld"><label for="pass">كلمة السر</label><input id="pass" type="password" required autocomplete="current-password" dir="ltr"></div>
<button type="submit" id="loginBtn" class="btn b"><i class="fa-solid fa-right-to-bracket"></i><span>تسجيل الدخول</span></button>
</form>
<p class="hint">لا تشارك حسابك مع غيرك، واخرج من الحساب عند استعمال جهاز مشترك.</p>
</section>

<section id="app" class="hidden" style="display:grid;gap:22px">
<div class="bar2">
<div class="who"><div class="av"><i class="fa-solid fa-user-tie"></i></div><div><h2 id="whoName"></h2><small id="whoDept"></small></div></div>
<div class="tb"><button class="ib" onclick="load(false)"><i class="fa-solid fa-rotate"></i>تحديث</button><button class="ib" onclick="exportCsv()"><i class="fa-solid fa-file-csv"></i>تصدير Excel</button></div>
</div>
<div class="stats" id="stats"></div>
<div class="flt">
<div class="sbx"><i class="fa-solid fa-magnifying-glass"></i><input id="q" oninput="onSearch(this.value)" placeholder="ابحث بالاسم أو رقم التسجيل أو الهاتف أو رقم المتابعة..." autocomplete="off"></div>
<div class="dch hidden" id="deptChips"></div>
<span class="upd" id="upd"></span>
</div>
<div class="list" id="list"></div>
</section>
</main>
<footer>
<div class="f-logo"><i class="fa-solid fa-building-columns"></i></div>
<p id="footer-title">لوحة فريق الدراسة - ENSTP</p>
<p id="footer-sub">بيانات الطلبة سرّية: لا تُنشر ولا تُحفظ خارج هذا النظام</p>
</footer>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="mbox">
<button class="mx" onclick="closeModal()" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
<h3 id="mTitle"></h3><div class="sub" id="mSub"></div>
<div class="grid" id="mGrid"></div>
<div class="contact" id="mContact"></div>
<div class="fld"><label for="mStatus">حالة الطلب</label><select id="mStatus"></select></div>
<div class="fld"><label for="mNote">ملاحظة تظهر للطالب (اختياري)</label><textarea id="mNote" maxlength="300" placeholder="مثال: وثيقتك جاهزة، تفضّل إلى الشباك رقم 3 من 09:00 إلى 12:00."></textarea></div>
<button class="btn b" id="saveBtn" onclick="saveReq()"><i class="fa-solid fa-floppy-disk"></i><span>حفظ التحديث</span></button>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="enstp-sb.js"></script>
<script>
const SK='sc-admin-session';
const DEPT={cp:'السنتان التحضيريتان (CP)',dib:'تخصص DIB',dms:'تخصص DMS',all:'جميع الأقسام (مشرف)'};
const LEVEL={cp1:'السنة الأولى تحضيري',cp2:'السنة الثانية تحضيري',y3:'السنة الثالثة (أولى تخصص)',y4:'السنة الرابعة (ثانية تخصص)',y5:'السنة الخامسة (تخرج)'};
const DOC={cert:'شهادة مدرسية',trans:'كشف النقاط السنوي',quit:'إبراء الذمة (Quitus)',card:'بطاقة الطالب (بديل ضائع)'};
const ST={new:['جديد','#fde68a','#78350f','fa-bell'],processing:['قيد المعالجة','#bfdbfe','#1e3a8a','fa-gears'],ready:['جاهز للاستلام','#bbf7d0','#14532d','fa-circle-check'],delivered:['تم التسليم','#e5e7eb','#374151','fa-handshake'],rejected:['مرفوض','#fecaca','#7f1d1d','fa-ban']};
const ORDER=['new','processing','ready','delivered','rejected'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null,staff=null,rows=[],known=new Set(),fStatus='all',fDept='all',fQ='',cur=null,timer=null;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600);}
function ago(iso){const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<1?'الآن':m<60?'قبل '+m+' د':m<1440?'قبل '+Math.floor(m/60)+' س':'قبل '+Math.floor(m/1440)+' ي';}
function fmtDate(iso){return new Date(iso).toLocaleString('ar-DZ',{dateStyle:'medium',timeStyle:'short'});}

/* ---------- الجلسة ---------- */
function loadSession(){try{session=JSON.parse(sessionStorage.getItem(SK))}catch(e){session=null}}
function saveSession(t){
  session={access_token:t.access_token,refresh_token:t.refresh_token,expires_at:Math.floor(Date.now()/1000)+(t.expires_in||3600),user_id:(t.user&&t.user.id)||(session&&session.user_id)};
  try{sessionStorage.setItem(SK,JSON.stringify(session))}catch(e){}
}
async function tok(){
  if(!session)throw new Error('401 no session');
  if(session.expires_at-Math.floor(Date.now()/1000)<90){saveSession(await SB.refresh(session.refresh_token));}
  return session.access_token;
}
function logout(msg){
  clearInterval(timer);session=null;staff=null;rows=[];known=new Set();
  try{sessionStorage.removeItem(SK)}catch(e){}
  $('app').classList.add('hidden');$('loginBox').classList.remove('hidden');$('logoutTop').classList.add('hidden');
  document.title='لوحة فريق الدراسة - ENSTP';
  const er=$('loginErr');if(msg){er.textContent=msg;er.classList.remove('hidden')}else er.classList.add('hidden');
}
async function doLogin(e){
  e.preventDefault();$('loginErr').classList.add('hidden');
  if(!SB.ready){logout('الخدمة غير مفعّلة: أضف ملف enstp-sb.js إلى الموقع.');return;}
  const b=$('loginBtn');b.disabled=true;b.style.opacity=.6;
  try{saveSession(await SB.login($('email').value.trim(),$('pass').value));$('pass').value='';await enter();}
  catch(err){logout(SB.explain(err));}
  b.disabled=false;b.style.opacity=1;
}
async function enter(){
  const token=await tok();
  const r=await SB.rest('/rest/v1/sc_staff?select=dept,full_name&user_id=eq.'+session.user_id,{token});
  staff=r&&r[0];
  if(!staff){logout('حسابك صحيح لكنه غير مرتبط بأي قسم. اطلب من المشرف ربطه (جدول sc_staff).');return;}
  $('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logoutTop').classList.remove('hidden');
  $('whoName').textContent=staff.full_name||'موظف الدراسة';
  $('whoDept').textContent=DEPT[staff.dept]||staff.dept;
  $('deptChips').classList.toggle('hidden',staff.dept!=='all');
  fDept='all';fStatus='all';fQ='';$('q').value='';
  await load(true);
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden&&session)load(false)},30000);
}

/* ---------- تحميل الطلبات ---------- */
async function load(first){
  try{
    const token=await tok();
    const data=await SB.rest('/rest/v1/sc_requests?select=*&order=created_at.desc&limit=1000',{token});
    const fresh=data.filter(r=>!known.has(r.id)&&r.status==='new');
    if(!first&&fresh.length)toast('🔔 وصل '+fresh.length+(fresh.length===1?' طلب جديد':' طلبات جديدة'));
    data.forEach(r=>known.add(r.id));rows=data;render();
    $('upd').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-DZ',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(/JWT|401|PGRST301/i.test(String(e.message)))logout('انتهت جلستك، سجّل الدخول من جديد.');
    else toast(SB.explain(e));
  }
}

/* ---------- العرض ---------- */
function visibleBase(){return rows.filter(r=>fDept==='all'||r.dept===fDept);}
function render(){
  const base=visibleBase();
  $('stats').innerHTML=`<button class="st ${fStatus==='all'?'on':''}" onclick="setStatus('all')"><i class="fa-solid fa-inbox" style="color:var(--gold)"></i><b>${base.length}</b><span>كل الطلبات</span></button>`+
    ORDER.map(k=>`<button class="st ${fStatus===k?'on':''}" onclick="setStatus('${k}')"><i class="fa-solid ${ST[k][3]}" style="color:${k==='rejected'?'#dc2626':k==='ready'?'#059669':'var(--gold)'}"></i><b>${base.filter(r=>r.status===k).length}</b><span>${ST[k][0]}</span></button>`).join('');
  if(staff&&staff.dept==='all')$('deptChips').innerHTML=[['all','الكل'],['cp','CP'],['dib','DIB'],['dms','DMS']].map(d=>`<button class="${fDept===d[0]?'on':''}" onclick="setDept('${d[0]}')">${d[1]}</button>`).join('');
  const q=fQ.toLowerCase();
  const list=base.filter(r=>(fStatus==='all'||r.status===fStatus)&&(!q||[r.code,r.full_name,r.matricule,r.phone].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML=list.length?list.map(r=>{const s=ST[r.status]||ST.new;
    return `<button class="rq ${r.status==='new'?'nw':''}" onclick="openReq(${r.id})"><span class="cd">${esc(r.code)}</span><div><h3>${esc(r.full_name)}${staff&&staff.dept==='all'?`<span class="tag ${esc(r.dept)}">${esc(r.dept.toUpperCase())}</span>`:''}</h3><div class="mt"><b>${esc(DOC[r.doc_type]||r.doc_type)}</b> · ${esc(LEVEL[r.level]||r.level)} · ${esc(r.matricule)} · ${ago(r.created_at)}</div></div><span class="pill" style="background:${s[1]};color:${s[2]}">${s[0]}</span></button>`;}).join(''):
    '<div class="empty"><i class="fa-regular fa-folder-open"></i>لا توجد طلبات مطابقة.</div>';
  const n=rows.filter(r=>r.status==='new').length;
  document.title=(n?'('+n+') ':'')+'لوحة فريق الدراسة - ENSTP';
}
function setStatus(k){fStatus=k;render();}
function setDept(d){fDept=d;render();}
function onSearch(v){fQ=v.trim();render();}

/* ---------- تفاصيل الطلب ---------- */
function waLink(p){let d=String(p).replace(/\D/g,'');if(d.startsWith('0'))d='213'+d.slice(1);return 'https://wa.me/'+d;}
function openReq(id){
  const r=rows.find(x=>x.id===id);if(!r)return;cur=r;
  $('mTitle').textContent=r.full_name;
  $('mSub').textContent=r.code+' · '+(DEPT[r.dept]||r.dept);
  $('mGrid').innerHTML=[['رقم التسجيل',r.matricule],['المستوى',LEVEL[r.level]||r.level],['الوثيقة المطلوبة',DOC[r.doc_type]||r.doc_type],['الهاتف',r.phone],['تاريخ الطلب',fmtDate(r.created_at)],['آخر تحديث',fmtDate(r.updated_at)]].map(x=>`<div><small>${x[0]}</small><span dir="auto">${esc(x[1])}</span></div>`).join('')+(r.details?`<div class="w"><small>ملاحظات الطالب</small><span>${esc(r.details)}</span></div>`:'');
  $('mContact').innerHTML=`<a href="tel:${esc(r.phone)}"><i class="fa-solid fa-phone"></i>اتصال</a><a href="${waLink(r.phone)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i>واتساب</a>`;
  $('mStatus').innerHTML=ORDER.map(k=>`<option value="${k}" ${r.status===k?'selected':''}>${ST[k][0]}</option>`).join('');
  $('mNote').value=r.public_note||'';
  $('modal').classList.add('open');
}
function closeModal(){$('modal').classList.remove('open');cur=null;}
async function saveReq(){
  if(!cur)return;const b=$('saveBtn');b.disabled=true;b.style.opacity=.6;
  try{
    const token=await tok();
    const res=await SB.rest('/rest/v1/sc_requests?id=eq.'+cur.id,{method:'PATCH',token,prefer:'return=representation',body:{status:$('mStatus').value,public_note:$('mNote').value.trim().slice(0,300)||null}});
    if(!res||!res.length)throw new Error('42501');
    Object.assign(cur,res[0]);toast('تم حفظ التحديث ✅');closeModal();render();
  }catch(e){toast(SB.explain(e))}
  b.disabled=false;b.style.opacity=1;
}

/* ---------- تصدير CSV ---------- */
function exportCsv(){
  const q=fQ.toLowerCase();
  const list=visibleBase().filter(r=>(fStatus==='all'||r.status===fStatus)&&(!q||[r.code,r.full_name,r.matricule,r.phone].join(' ').toLowerCase().includes(q)));
  if(!list.length){toast('لا توجد بيانات للتصدير');return;}
  const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['الرقم','القسم','المستوى','الاسم','رقم التسجيل','الهاتف','الوثيقة','ملاحظات الطالب','الحالة','ملاحظة للطالب','تاريخ الطلب'];
  const lines=[head.map(cell).join(',')].concat(list.map(r=>[r.code,DEPT[r.dept],LEVEL[r.level]||r.level,r.full_name,r.matricule,r.phone,DOC[r.doc_type],r.details,(ST[r.status]||[r.status])[0],r.public_note,fmtDate(r.created_at)].map(cell).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='demandes-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();
}

function toggleTheme(){
  const r=document.documentElement,next=r.dataset.theme==='dark'?'light':'dark';
  r.dataset.theme=next;$('metaTheme').content=next==='dark'?'#040b17':'#f3f6fc';
  try{localStorage.setItem('enstp-theme',next)}catch(e){}
}
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('DOMContentLoaded',async()=>{
  $('metaTheme').content=document.documentElement.dataset.theme==='dark'?'#040b17':'#f3f6fc';
  const pb=$('progressBar');addEventListener('scroll',()=>{const h=document.documentElement;pb.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
  loadSession();
  if(session&&SB.ready){try{await enter()}catch(e){logout('انتهت جلستك، سجّل الدخول من جديد.')}}
});
</script>
</body>
</html>

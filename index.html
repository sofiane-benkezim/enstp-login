<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة دليل طالب ENSTP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                        accent: { 500: '#f59e0b' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="font-cairo bg-slate-900 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginModal" class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl border border-slate-100 text-center relative z-50">
        <div class="w-16 h-16 bg-brand-50 text-brand-700 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
            <!-- <i class="fa-solid fa-graduation-cap"></i> -->
              <div class="p-1">
                        <img src="https://enstp.edu.dz/themes/custom/corporate3/logo.png" alt="شعار ENSTP" class="h-20 w-auto object-contain">
                    </div>
        </div>
        
        <h2 class="text-2xl font-black text-brand-900 mb-2">منصة طالب ENSTP</h2>
        <p class="text-slate-500 text-xs font-semibold mb-6">هذه المنصة مخصصة فقط لطلبة المدرسة العليا للأشغال العمومية. يرجى إدخال البريد الإلكتروني المؤسساتي للدخول.</p>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-right">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني الجامعي:</label>
                <div class="relative">
                    <input type="email" id="studentEmail" placeholder="nom.prenom@enstp.edu.dz" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-brand-500 pl-10 text-left dir-ltr">
                    <i class="fa-solid fa-envelope absolute left-3 top-3.5 text-slate-400"></i>
                </div>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-xs font-bold text-center">
                <i class="fa-solid fa-circle-exclamation ml-1"></i> عذراً، هذا البريد ليس بريداً رسمياً تابعة للمدرسة ENSTP!
            </div>

            <button type="submit" class="w-full py-3.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl text-sm shadow-lg shadow-brand-700/30 transition duration-200">
                التحقق والدخول للمنصة <i class="fa-solid fa-arrow-left mr-2"></i>
            </button>
        </form>

        <p class="text-[11px] text-slate-400 mt-6 font-semibold">
            <i class="fa-solid fa-shield-halved ml-1"></i> يتم التحقق تلقائياً من امتداد البريد الرسمي للطالب
        </p>
    </div>

    <script>
        // الأطراف والامتدادات المسموح بها لبريد المدرسة
        const ALLOWED_DOMAINS = ["@enstp.edu.dz", "@enstp.dz"];

        function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
            const errorMsg = document.getElementById('errorMessage');

            // التحقق هل ينتهي الإيميل بأحد امتدادات المدرسة
            const isValid = ALLOWED_DOMAINS.some(domain => emailInput.endsWith(domain));

            if (isValid) {
                errorMsg.classList.add('hidden');
                // حفظ حالة تسجيل الدخول في المتصفح
                localStorage.setItem('enstp_user_logged_in', 'true');
                localStorage.setItem('enstp_user_email', emailInput);
                window.location.href = "guide.html"; 
            } else {
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
